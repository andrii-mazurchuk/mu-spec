[project]
name = "mu-spec"
version = "0.1.0"
description = "Memory unit: authoritative per-project documentation, served over the standard unit contract."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
mu-spec = "mu_spec.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mu_spec*"]
