        <b style="color:var(--ink);font-size:15px">${side.served.size}</b> waiting on it in-layer</p>`;
  if(!e.module) loadBody(id);
}

/* What judges this entry, or what this scenario judges. A graph query in
   both directions -- nothing is stored, so "which tests do I run after
   building this" has a mechanical answer rather than a convention. */
function verifyPanel(e){
  const pill=(label,ids)=>ids.length
    ? `<div class="edgelist"><span>${esc(label)}</span>${ids.map(i=>
        `<button class="pill" data-goto="${esc(i)}">${esc(
          (STATE.byId[i]||{}).module?short(i):i)}</button>`).join("")}</div>` : "";

  if(e.test && !e.module){
    const files=modulesOf(e.id);
    return `<h3>Scenario</h3>
      ${pill("judges \u2014 exactly one contract", e.derives)}
      ${files.length
        ? pill("written in", files.map(f=>f.id))
        : `<p class="muted">No file implements this yet, so it is in no work
           unit and orders nothing. <b>Not a failure</b> \u2014 a scenario that
           has been specified but not built is not yet expected to pass.</p>`}`;
  }
  if(e.module || e.layer!==LIX.S) return "";

  const ts=testsOf(e.id);
  if(!ts.length) return `<h3>Verification</h3>
    <p class="muted">Nothing says how this contract can be caught failing.
    Reported, never a blocker: tests are written after the spec and before
    the code, so every entry is untested in between.</p>`;
  const ready=ts.filter(t=>modulesOf(t.id).length);
  const pending=ts.filter(t=>!modulesOf(t.id).length);
  return `<h3>Verification</h3>
    ${pill("run after building", ready.map(t=>t.id))}
    ${pill("written, no file yet", pending.map(t=>t.id))}
    <p class="muted">The unit building this <b>follows</b> the unit holding
    those files. Documentation first, tests second, code last \u2014 ordered
    rather than asked for.</p>`;
}

/* The branch this node would be built on. Named here rather than drawn as
   a shape on the graph: a unit groups across columns and across both
   bands, so a hull around one asserts an adjacency that does not exist.
   Selecting the node lights its peers instead. */
function unitPanel(e){
  const key=unitOf(e.id);
  if(!key) return `<h3>Work unit</h3>
    <p class="muted">In none \u2014 no file implements this, so it is in no
    piece of work yet.</p>`;
  const src=unitSource();
  const byKey=Object.fromEntries(((src&&src.units)||[]).map(u=>[u.key,u]));
  const u=byKey[key]||{}, follows=((src&&src.edges)||{})[key]||[];
  const followedBy=Object.entries((src&&src.edges)||{})
    .filter(pair=>(pair[1]||[]).includes(key)).map(pair=>pair[0]);
  const label=k=>((byKey[k]||{}).tests?"tests: ":"")+(((byKey[k]||{}).modules||[])[0]||k);
  const nMod=(u.modules||[]).length, nEnt=(u.entries||[]).length;
  return `<h3>Work unit</h3>
    <p><code>${esc(key)}</code>${u.tests?` \u00b7 <b class="tstag">tests</b>`:""}${
      u.cycle?` \u00b7 <span class="warnish">contracted</span>`:""}</p>
    <p class="muted">${nMod} file${nMod===1?"":"s"} \u00b7 ${nEnt} entr${
      nEnt===1?"y":"ies"} \u00b7 ${
      follows.length?`follows ${follows.length}`:"waits on nothing"}${
      followedBy.length?` \u00b7 ${followedBy.length} waiting on it`:""}</p>
    <p class="muted">${u.tests
      ? "A unit holding test files has no outbound edge to have, so it is a <b>root</b>: it lands in wave 0 and cannot sit inside a cycle."
      : "Its files are disjoint from every other unit's by construction, so nothing else can be editing them while this is built."}</p>
    ${follows.length?`<div class="edgelist"><span>follows</span>${
      follows.map(k=>`<span class="pill flat">${esc(label(k))}</span>`
      ).join("")}</div>`:""}
    ${followedBy.length?`<div class="edgelist"><span>waited on by</span>${
      followedBy.map(k=>`<span class="pill flat">${esc(label(k))}</span>`
      ).join("")}</div>`:""}
    ${(STATE.units&&STATE.units.cut)?`<p class="muted">From the live graph.
      The stored cut is what work was actually handed out from — see
      Waves.</p>`:""}`;
}

/* A body is fetched only when an entry is actually opened. The spine
   deliberately carries none: loading every body to draw a graph that
   shows none of them is the thing the split exists to prevent. */
async function loadBody(id){
  const el=()=>$("body");
  if(STATE.bodies[id]!==undefined){ if(el()) el().textContent=STATE.bodies[id]; return; }
  if(!STATE.live){
    STATE.bodies[id]="(sample data — no body)";
    if(el()) el().textContent=STATE.bodies[id]; return;
  }
  try{
    const d=await get("projects/"+enc(STATE.project)+"/entries/"+enc(id));
    /* `purpose` rides with the body rather than with the spine:
       it is prose for whoever writes the test, and the spine
       carries none by design. One fetch brings both. */
    const why = d.purpose ? "PURPOSE — "+d.purpose+"\n\n" : "";
    STATE.bodies[id]=why+(d.body||"(no body)");
  }catch(_){ STATE.bodies[id]="(body unavailable)"; }
  if(sel===id && el()) el().textContent=STATE.bodies[id];
}

/* Re-rendered on a layout change: half of it describes things that only
   one of the two drawings has, and a legend for furniture that is not on
   screen is worse than no legend. */
function resetInspector(){
  $("detail").innerHTML=`<h3>Entry</h3>
  <p class="muted">Pick an entry in the spine. Click blank canvas or press Esc to release.</p>
  <h3>Legend</h3>
  <p class="muted"><b>—→</b> derives_from, one layer up. The only edge that crosses a column.</p>
  <p class="muted"><b>⌒</b> depends_on, same layer. This is what slice dependency is projected
  from — and it routinely crosses slices.</p>
  <p class="muted"><b>⌒ dashed</b> emits_into, same layer, only into a cross-cutting slice.
  Imposes no order.</p>
  <p class="muted"><b>dashed box</b> a declared module — code, not an entry.</p>
  <h3>Scenarios</h3>
  <p class="muted">A scenario forks off spec rather than continuing under it, so it is
  never the fifth link in the chain. Two ways to draw that, and they trade against each
  other — <b>band</b> and <b>inline</b>, in the bar above.</p>
  ${LAYOUT==="band"
    ? `<p class="muted"><b>band</b> puts scenarios in a row below the corpus. The
       verification layer reads as one picture. The costs: every judged contract appears
       twice, and the chain back to intent is not on screen.</p>
       <p class="muted"><b>outlined box</b> a copy of a spec entry, placed beside the
       scenarios that judge it. A reference, not a second entry — clicking one selects
       the entry it copies.</p>`
    : `<p class="muted"><b>inline</b> puts scenarios in the Tests column beside the
       contract they judge. Nothing is duplicated and the whole derivation reads straight
       across. The cost: verification stops being one thing you can look at, and a
       project with few scenarios has a mostly empty column running its height.</p>`}
  <p class="muted"><b>dashed scenario</b> written, no file yet. It is in no work unit, so
  it orders nothing and is not yet expected to pass — not a failure.</p>
  <h3>Work units</h3>
  <p class="muted">Select anything and the rest of its work unit lights up — the files and
  entries that would be built on one branch. Shown on selection rather than drawn as a
  shape, because a unit groups across columns and across both bands, and any outline
  around one states an adjacency the graph does not have.</p>`;
}

/* Blank canvas, or Escape, releases whichever mode is active. */
function clearAll(){ sel=null; focusSlice=null; syncLegend(); repaint(); resetInspector(); }
function syncLegend(){
  for(const o of $("legend").querySelectorAll(".leg"))
    o.setAttribute("aria-pressed", o.dataset.s===focusSlice);
}

/* =============================================================
   WAVES — computed by the unit, displayed here. The page projects
   nothing: two statements of the same fact drift.
   ============================================================= */
function drawWaves(){
  const names=Object.keys(STATE.slices);
  if(!names.length){
    $("waves").innerHTML=`<h3>Execution order</h3>
      <p class="muted">No slices yet — a partition is not a partition until a human ratifies one.</p>`;
    $("k-waves").textContent="0"; return;
  }
  const rows=(STATE.waves.length?STATE.waves:[{wave:0,slices:names}]).map(w=>
    `<div class="wave"><div class="lbl">wave ${w.wave}</div>`+
    (w.slices||[]).map(s=>{
      const info=STATE.slices[s]||{};
      const on=info.deps||[];
      return `<div class="slice" style="--sl:${hueOf(s)}">
        <b>${esc(s)}</b>
        <em>${info.type==="cross_cutting"?"cross-cutting ✳":"feature"} · ${info.size||0} entries${
          info.cohesion!=null?" · cohesion "+Number(info.cohesion).toFixed(2):""}</em>
        <em>${on.length?"after "+on.map(x=>`<code>${esc(x)}</code>`).join(", ")
                       :"depends on nothing"}</em></div>`;}).join("")+`</div>`).join("");
  $("waves").innerHTML=`<h3>Deriving — the order slices may be written in</h3>${rows}
    <p class="muted" style="max-width:64ch">A slice's wave is the <b>longest</b> path from it to a
    slice that depends on nothing — projected from entry <code>depends_on</code> edges that cross a
    slice boundary, never authored anywhere. Two slices in the same wave provably have no edge
    between them, so they can be worked in parallel with nothing to coordinate; every earlier wave
    is finished before the next starts, so a wave-N agent reads its dependencies as frozen.
    A cross-cutting slice lands in wave 0 by construction — the edge rules leave it no outbound
    dependency to have.
    <br><br>This is an <b>authoring</b> order. It says which slice may be derived next, not which
    file may be built next — those are different questions with different answers.</p>
    ${unitWaves()}`;
  $("k-waves").textContent=STATE.waves.length||1;

  const cut = $("do-cut");
  if(cut) cut.onclick = cutUnits;
  for(const b of $("waves").querySelectorAll(".unitchip"))
    b.onclick = () => {
      SEL_UNIT = SEL_UNIT === b.dataset.unit ? null : b.dataset.unit;
      drawWaves(); showUnit(SEL_UNIT);
    };
}

/* Scenarios judging a contract nobody is building. Ordinary and temporary
   while tests run ahead of code -- which is the intended order -- so this
   is stated rather than flagged. A standing one is the thing worth seeing. */
function unfollowedNote(source){
  const keys = (STATE.units && STATE.units.live
    && STATE.units.live.unfollowed_tests) || [];
  if(!keys.length) return "";
  const byKey = Object.fromEntries((source.units||[]).map(x=>[x.key,x]));
  const names = keys.map(k=>((byKey[k]||{}).modules||[])[0]||k);
  return `<div class="earlynote"><b>${keys.length} test unit${
    keys.length===1?"":"s"} nothing follows</b>
    ${names.map(esc).join(", ")} — every contract these scenarios judge is
    unimplemented, so there is no unit to precede. Ordinary while tests run
    ahead of the code. A standing one is judging a contract nobody is
    building.</div>`;
}

/* A unit in the inspector. The card in the wave is a summary; this is the
   thing itself -- what it holds, what it may write, and what it waits on. */
function showUnit(key){
  if(!key){ resetInspector(); return; }
  const u = STATE.units, src = (u && u.cut) || (u && u.live);
  const x = ((src && src.units) || []).find(v => v.key === key);
  if(!x){ resetInspector(); return; }
  const follows = ((src.edges || {})[key] || []);
  const byKey = Object.fromEntries((src.units || []).map(v => [v.key, v]));
  const label = k => (byKey[k] && byKey[k].modules[0]) || k;
  $("detail").innerHTML =
    `<h3>Work unit</h3>
     <p><code>${esc(key)}</code>${x.cycle ? ` · <span class="warnish">contracted</span>` : ""}</p>
     <div class="body">One unit is one branch. These files are disjoint from every other unit's, so nothing else can be editing them while this is built — a property of how the grouping is computed, not a rule anyone has to follow.${
       x.cycle ? `

This one is a contraction: its files depend on each other, so they cannot be built separately. That is a fact about the module map, not a defect.` : ""}</div>
     <div class="edgelist"><span>write set — ${x.modules.length} ${
       x.modules.length === 1 ? "file" : "files"}</span>
       ${x.modules.map(m => `<span class="pill">${esc(m)}</span>`).join("")}</div>
     <div class="edgelist"><span>implements — ${x.entries.length} ${
       x.entries.length === 1 ? "entry" : "entries"}</span>
       ${x.entries.map(i =>
         `<button class="pill" data-go="${esc(i)}">${esc(i)}</button>`).join("")}</div>
     <div class="edgelist"><span>slice${x.slices.length === 1 ? "" : "s"}</span>
       ${x.slices.map(sl => `<span class="pill">${esc(sl)}</span>`).join("")
         || `<span class="muted">none</span>`}${
         x.slices.length > 1 ? `<p class="warnish" style="margin:6px 0 0;font-size:12px">No
         single owning slice — a file here straddles a boundary.</p>` : ""}</div>
     <div class="edgelist"><span>waits on — ${follows.length}</span>
       ${follows.map(k =>
         `<button class="pill" data-unit="${esc(k)}">${esc(label(k))}</button>`).join("")
         || `<span class="muted">nothing — buildable now</span>`}</div>`;
  for(const b of $("detail").querySelectorAll("[data-go]"))
    b.onclick = () => { sel = b.dataset.go; show("spine"); repaint(); inspect(); };
  for(const b of $("detail").querySelectorAll("[data-unit]"))
    b.onclick = () => { SEL_UNIT = b.dataset.unit; drawWaves(); showUnit(SEL_UNIT); };
}

let SEL_UNIT = null;

/* Cutting is a person's decision, which is why it is a button here and not a
   tool an agent can reach. Every gate can be green while the author is still
   revising, so nothing takes a cut on its own. */
async function cutUnits(){
  const btn = $("do-cut");
  if(btn) btn.disabled = true;
  STATE.cutFlash = {kind:"busy", text:"Cutting…"};
  drawWaves();
  try{
    const r = await fetch("projects/"+enc(STATE.project)+"/units/cut", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({note: ""})
    });
    const text = await r.text();
    let payload = null;
    try{ payload = JSON.parse(text); }catch(_){}
    if(!r.ok){
      STATE.cutFlash = {kind:"bad",
        text:(payload && payload.reason) || ("Refused — " + r.status)};
      drawWaves();
      return;
    }
    const moved = payload.drift && payload.drift.changed ? payload.drift.changed.length : 0;
    STATE.cutFlash = {kind:"ok", text:
      "Cut " + payload.seq + " taken — " + payload.units.length + " work units" +
      (payload.unimplemented.length
        ? ", and " + payload.unimplemented.length + " spec " +
          (payload.unimplemented.length === 1 ? "entry is in none of them" : "entries are in none of them")
        : "") +
      (payload.seq > 1
        ? moved ? ". " + moved + " unit" + (moved===1?"":"s") + " moved since the last cut."
                : ". Nothing moved since the last cut."
        : ".")};
    // Re-read rather than patch: a cut is what later work is handed out from,
    // so the page should be showing what was actually written, not what this
    // tab believes it wrote.
    await selectProject(STATE.project);
    drawWaves();
  }catch(err){
    STATE.cutFlash = {kind:"bad", text:"Could not reach this unit: " + err.message +
      "\n\nNothing was cut."};
    drawWaves();
  }
}

/* The second grain. Slice waves answer "what may be derived next"; work-unit
   waves answer "what may be built next", and they disagree — a slice
   scheduled late can hold files that depend on nothing at all. Showing only
   the first reads as a bottleneck that is not there. */
function unitWaves(){
  const u = STATE.units;
  const source = (u && u.cut) || (u && u.live) || null;
  const flash = STATE.cutFlash
    ? `<div id="cutflash" class="${esc(STATE.cutFlash.kind)}">${esc(STATE.cutFlash.text)}</div>`
    : "";
  const button = STATE.project
    ? `<button id="do-cut" class="cutbtn">${u && u.cut ? "Re-cut" : "Cut work units"}</button>`
    : "";
  const bar = `<div class="cutbar">${button}<span class="muted">Cutting is yours to do — an
    agent is never offered it, because a session that could cut would be deciding you had
    finished revising. Re-cutting is free.</span></div>${flash}`;
  if(!source || !(source.units || []).length){
    return `<h3 class="again">Building — the order work units may be built in</h3>${bar}
      <p class="muted" style="max-width:64ch">No work units yet. A work unit is a set of files and
      the spec entries they implement, grouped so that no two units share a file — which is what
      lets two branches run at once without being able to collide. They appear once modules are
      declared and a person cuts the project into them.</p>`;
  }
  const byKey = Object.fromEntries(source.units.map(x=>[x.key,x]));
  const sliceWave = {};
  for(const w of STATE.waves) for(const name of (w.slices||[])) sliceWave[name]=w.wave;

  // A unit whose slices are all scheduled later than the unit itself. Slice
  // order over-serialises the build, and this is the size of that.
  const early = source.units.filter(x=>{
    const w = (source.waves||[]).findIndex(v=>(v.units||[]).includes(x.key));
    const latest = Math.max(-1, ...(x.slices||[]).map(s=>sliceWave[s] ?? -1));
    return w >= 0 && latest > w;
  });

  const rows = (source.waves||[]).map(w=>
    `<div class="wave"><div class="lbl">wave ${w.wave}</div><div class="unitbody">`+
    (w.units||[]).map(k=>{
      const x = byKey[k] || {};
      const mods = x.modules || [], ents = x.entries || [], sls = x.slices || [];
      const only = sls.length === 1 ? sls[0] : null;
      const follows = ((source.edges||{})[k]||[]).length;
      const waiting = Object.values(source.edges||{})
        .filter(v=>(v||[]).includes(k)).length;
      return `<button class="unitchip${x.cycle?" cyc":""}${sls.length>1?" multi":""}${
          x.tests?" tst":""}"
          style="--sl:${hueOf(only||"unsliced")}" data-unit="${esc(k)}"
          aria-pressed="${SEL_UNIT===k}">
        <b>${esc(mods[0]||k)}</b>
        ${mods.length>1?`<span class="more">+ ${esc(mods.slice(1).join(", "))}</span>`:""}
        <span class="facts">
          ${x.tests?`<em class="tstag">scenarios</em>`:""}
          <em>${ents.length} ${ents.length===1?"entry":"entries"}</em>
          <em>${mods.length} ${mods.length===1?"file":"files"}</em>
          ${follows?`<em>follows ${follows}</em>`:`<em>waits on nothing</em>`}
          ${waiting?`<em>${waiting} waiting on it</em>`:""}
          ${x.cycle?`<em>cycle</em>`:""}
          ${sls.length>1?`<em>${sls.length} slices</em>`:""}
        </span></button>`;
    }).join("")+
    `<span class="wwidth">${(w.units||[]).length} wide</span></div></div>`).join("");

  const note = early.length
    ? `<div class="earlynote"><b>${early.length} work unit${early.length===1?"":"s"}
       ${early.length===1?"is":"are"} buildable before ${early.length===1?"its":"their"} slice</b>
       Slice order says these come later; nothing they depend on says so. Reading a slice wave as a
       build order leaves work on the floor.</div>`
    : "";

  return `<h3 class="again">Building — the order work units may be built in</h3>${bar}
    ${u.cut ? `<p class="muted">From cut ${u.cut.seq}${
        u.cut.note ? " — " + esc(u.cut.note) : ""}${
        u.drift && u.drift.changed && u.drift.changed.length
          ? ` · <span class="warnish">${u.drift.changed.length} unit${
              u.drift.changed.length===1?" has":"s have"} moved since</span>`
          : " · matches the graph"}</p>`
      : `<p class="muted warnish">No cut taken — showing the live projection. Cutting is a person's
         decision, and nothing here has been handed out yet.</p>`}
    ${note}${rows}
    <p class="muted" style="max-width:64ch">A work unit is a maximal connected group of spec entries
    and the files implementing them. Its files are disjoint from every other unit's <b>by
    construction</b>, so two units in one wave cannot produce a merge conflict — that is a property
    of the grouping, not a rule anyone has to follow.
    <br><br>Order has <b>two</b> sources. Most of it is projected from <code>depends_on</code> one
    layer down. The rest is verification: <b>the unit implementing a contract follows the unit
    holding the scenarios that judge it</b> — documentation first, tests second, code last, ordered
    rather than asked for. A unit holding test files has no outbound edge to have, so it is always
    a root and always lands in wave 0; that is why this ordering can never deadlock.
    <br><br><b>The edges are the contract; these waves are a view.</b> A unit waits for what it
    actually depends on, not for a whole wave to finish.</p>${unfollowedNote(source)}`;
}

/* =============================================================
   MODULES

   A module is a file path with a list of spec identifiers attached, and
   it is the bottom of the chain: code is never an entry, so this backlink
   is the only thing tying a file to the reasoning that produced it.

   Drawn as coverage rather than as a graph. The relation is many-to-many
   in both directions -- one file implements eight entries, one entry is
   implemented by four files -- so a column in the layered spine reports a
   single owner for something that has several, and a bipartite diagram
   spends its space on the links rather than on the answer. The question a
   reader actually has is "is every entry claimed, and by what", which is a
   list.

   The gate leads, because an entry no module claims is work nobody can be
   handed: the ticket step cannot start while one exists.
   ============================================================= */
function moduleIndex(){
  const by = {};                      // entry id -> paths implementing it
  const slicesOf = {};                // path -> set of slices it reaches
  for(const m of STATE.modules){
    for(const id of (m.implements || [])){
      (by[id] = by[id] || []).push(m.path);
      const sl = (STATE.byId[id] || {}).slice;
      if(sl) (slicesOf[m.path] = slicesOf[m.path] || new Set()).add(sl);
    }
  }
  const spec = STATE.entries.filter(e => e.layer === LIX.S && !e.module);
  const gaps = spec.filter(e => !(by[e.id] || []).length);
  /* A module's kind is read off the identifiers it claims -- there is no
     stored field, because a field would be a second statement of exactly
     that. Mixed modules are refused at declaration. */
  const isTestModule = m => ((m.implements || [])[0] || "")[0] === "T";
  const shared = Object.entries(slicesOf)
    .filter(([, s]) => s.size > 1)
    .map(([path, s]) => ({path, slices: [...s].sort()}));
  const tests = STATE.entries.filter(e => e.test && !e.module);
  return {by, spec, gaps, shared, slicesOf, tests,
          testFiles: STATE.modules.filter(isTestModule),
          codeFiles: STATE.modules.filter(m => !isTestModule(m))};
}

/* Coverage has two independent questions and they must not be run
   together. "No file implements this contract" is work not started.
   "Nothing says how this contract can fail" is a contract nobody can
   falsify. A project can be perfect on one and empty on the other. */
function verifySection(ix){
  const nUn = STATE.untested.length, nPending = STATE.unimplementedTests.length;
  const head = !ix.tests.length
    ? `<div class="gate blocked"><span class="big">${ix.spec.length}</span><span>
         <b>Nothing says how any of this can fail</b>
         <em>Not a blocker, and not a defect: scenarios are written after the
         spec and before the code, so every contract is untested in between.
         A gate here would refuse the project during the ordinary course of
         writing it.</em></span></div>`
    : nUn
      ? `<div class="gate blocked"><span class="big">${nUn}</span><span>
           <b>${nUn===1?"One contract has":"Contracts with"} no scenario</b>
           <em>${ix.spec.length-nUn} of ${ix.spec.length} can be caught failing.
           Reported, never a blocker.</em></span></div>`
      : `<div class="gate open"><span class="big">${ix.spec.length}</span><span>
           <b>Every contract has a scenario</b>
           <em>Each one says how it can be caught failing, so "which tests do
           I run after building this" is a graph query rather than a
           convention.</em></span></div>`;

  const pending = nPending
    ? `<div class="gate blocked" style="margin-top:-8px">
         <span class="big">${nPending}</span><span>
         <b>${nPending===1?"One scenario is":"Scenarios"} written but not built</b>
         <em>${STATE.unimplementedTests.map(i=>`<code>${esc(i)}</code>`).join(", ")}
         <br><b>Not a failure.</b> A scenario with no file is in no work unit,
         so it orders nothing and is not yet expected to pass.</em></span></div>`
    : "";

  const rows = ix.tests.map(t => {
    const files = modulesOf(t.id);
    return `<div class="specrow${files.length?"":" gap"}">
      <code>${esc(t.id)}</code>
      <span class="ttl">${esc(t.title)}</span>
      <span class="files">${files.length
        ? files.map(f=>`<button class="file" data-path="${esc(f.id)}"
            title="${esc(f.id)}">${esc(shortPath(f.id))}</button>`).join("")
        : `<span class="nofile">no file yet</span>`}</span>
    </div>`;
  }).join("");

  return `<h3 class="again">Verification — contract to scenario</h3>${head}${pending}
    ${rows?`<div class="modslice" style="--sl:var(--brand)">
      <h4>scenarios<em>${ix.tests.length-nPending}/${ix.tests.length} built</em></h4>
      ${rows}</div>`:""}
    <p class="muted" style="max-width:66ch">A scenario derives from exactly one contract —
    one scenario, one thing it can catch. A file implements spec entries or test entries and
    never both, which is what puts the scenario and the code it judges in
    <b>different work units</b>, and so on different branches under different agents. Nobody
    has to obey a rule about not editing the tests: there is no shared file to edit.</p>`;
}

function drawModules(){
  const el = $("modules"), ix = moduleIndex();
  $("mdot").hidden = !ix.gaps.length;

  if(!ix.spec.length){
    el.innerHTML = `<h3>Modules</h3><p class="muted">No spec entries yet. A module
      declares which of them a file implements, so there is nothing to declare
      against until the spec layer exists.</p>`;
    return;
  }

  const covered = ix.spec.length - ix.gaps.length;
  const gate = ix.gaps.length
    ? `<div class="gate blocked"><span class="big">${ix.gaps.length}</span><span>
         <b>Not ready to become tickets</b>
         <em>${ix.gaps.length} spec ${ix.gaps.length===1?"entry has":"entries have"} no module.
         A ticket is a file and its reasons, so an entry nothing implements is work
         nobody can be handed — and the write set it would appear in comes back empty.</em>
       </span></div>`
    : `<div class="gate open"><span class="big">${covered}</span><span>
         <b>Every spec entry has a module</b>
         <em>Each one names the file that will carry it, so every entry can be turned
         into a unit of work with a path attached.</em>
       </span></div>`;

  const shared = ix.shared.length
    ? `<div class="gate blocked" style="margin-top:-8px">
         <span class="big">${ix.shared.length}</span><span>
         <b>${ix.shared.length===1?"One file serves":"Files serve"} more than one slice</b>
         <em>${ix.shared.map(s=>`<code>${esc(s.path)}</code> — ${esc(s.slices.join(" + "))}`).join("<br>")}
         <br>Each is editable whenever either slice changes, so the write ownership that
         holds strictly for entries does not hold for the file.</em></span></div>`
    : "";

  const names = Object.keys(STATE.slices).sort();
  const sections = names.map(name => {
    const rows = ix.spec.filter(e => e.slice === name);
    if(!rows.length) return "";
    const missing = rows.filter(e => !(ix.by[e.id] || []).length).length;
    return `<div class="modslice" style="--sl:${hueOf(name)}">
      <h4>${esc(name)}${isXC(name)?" ✳":""}
        <em>${rows.length - missing}/${rows.length} covered</em></h4>
      ${rows.map(e => {
        const files = ix.by[e.id] || [];
        return `<div class="specrow${files.length?"":" gap"}">
          <code>${esc(e.id)}</code>
          <span class="ttl">${esc(e.title)}</span>
          <span class="files">${
            files.length
              ? files.map(p=>`<button class="file${
                  (ix.slicesOf[p]||new Set()).size>1?" shared":""
                }" data-path="${esc(p)}" title="${esc(p)}">${esc(shortPath(p))}</button>`).join("")
              : `<span class="nofile">no module</span>`}</span>
        </div>`;
      }).join("")}
    </div>`;
  }).join("");

  el.innerHTML = `<h3>Modules — spec to code</h3>${gate}${shared}${sections}
    ${verifySection(ix)}
    <p class="muted" style="max-width:66ch">Code is not an entry in this graph and never is.
    A module is the backlink: a file path and the spec identifiers it implements, declared
    through <code>declare_module</code>. It is not a layer and not a grouping under slices —
    a slice is a partition, where every entry below intent belongs to exactly one, while a
    module is a many-to-many pointer in both directions.</p>`;

  for(const b of el.querySelectorAll(".file"))
    b.onclick = () => showModule(b.dataset.path);
}

const shortPath = p => {
  const s = String(p), parts = s.split(/[\\/]/);
  return parts.length > 1 ? parts.slice(-2).join("/") : s;
};

/* The inspector is the same column the spine uses, so a module opened from
   here reads like an entry opened from there. */
function showModule(path){
  const m = STATE.modules.find(x => x.path === path);
  if(!m) return;
  const ix = moduleIndex();
  const slices = [...(ix.slicesOf[path] || new Set())].sort();
  const impl = (m.implements || []);
  $("detail").innerHTML =
    `<h3>Module</h3><p><code>${esc(path)}</code></p>
     <div class="body">Code is not an entry in this graph. This is the backlink: the file
declares which spec entries it implements, and nothing else about it is stored here.</div>
     ${slices.length > 1 ? `<p class="warnish">Serves ${slices.length} slices —
       ${esc(slices.join(" + "))}. It is in the write set of either one's change.</p>` : ""}
     <div class="edgelist"><span>implements — ${impl.length} spec
       ${impl.length===1?"entry":"entries"}</span>
       ${impl.map(i=>`<button class="pill" data-go="${esc(i)}">${esc(i)}</button>`).join("")}</div>
     <div class="edgelist"><span>slice${slices.length===1?"":"s"} reached</span>
       ${slices.map(s=>`<span class="pill">${esc(s)}</span>`).join("") || `<span class="muted">none</span>`}</div>`;
  for(const b of $("detail").querySelectorAll("[data-go]"))
    b.onclick = () => { sel = b.dataset.go; show("spine"); repaint(); inspect(); };
}

/* =============================================================
   QUEUES
   ============================================================= */
const when=t=>{ if(!t) return ""; const d=new Date(t*1000);
  return isNaN(d) ? "" : d.toISOString().slice(0,16).replace("T"," "); };

/* The proposal lives in Queues because Queues already means "things waiting
   on a human" -- pending requests, escalated issues. A pending partition is
   the same kind of thing, so it needs no page and no rail item of its own.
   The banner is the notification; this is the decision.

   It is deliberately not a third table. Two buttons over a list of slice
   names would be a rubber stamp, and rubber-stamping is the one outcome
   this gate exists to prevent -- so it shows what the unit already computed:
   whether the cut is legal, what execution order it produces, and what it
   fails to place. */
function proposalHTML(){
  const p=STATE.proposal;
  if(!p) return "";
  const s=p.score||{}, slices=s.slices||[];
  const names=Object.keys(p.proposal||{});
  const cards=(slices.length?slices:names.map(n=>({slice:n,size:(p.proposal[n]||[]).length})))
    .map(x=>{
      const xc=(p.types||{})[x.slice]==="cross_cutting"||x.type==="cross_cutting";
      return `<div class="card" style="--sl:${hueOf(x.slice)}">
        <b>${esc(x.slice)}</b>
        <em>${xc?"cross-cutting &#10003;":"feature"} &middot; ${x.size} entries</em>
        <em>${x.cohesion==null?"cohesion n/a":"cohesion "+Number(x.cohesion).toFixed(2)}</em>
        <em>${(x.depends_on||[]).length?"after "+x.depends_on.map(esc).join(", ")
                                      :"depends on nothing"}</em></div>`;}).join("");
  const wv=(s.waves||[]).map(w=>"w"+w.wave+": "+(w.slices||[]).map(esc).join(", "))
    .join("  &middot;  ");
  const un=(s.unassigned||[]).length;
  const scored=p.score!=null;
  return `<div class="qsec"><div class="decide">
    <h3>Awaiting your ratification</h3>
    <div class="inert">
      <b>These two buttons write. Pressing one is the decision.</b>
      They reach this unit through the two paths it declares at <code>/actions</code>
      &mdash; a manifest no agent is ever offered, which is why ratifying is reachable
      by a person here and by no tool anywhere. Every press is audited.
      <br><br>
      Being absent from <code>/tools</code> means <b>not offered to the model</b>, and
      not one step more. A caller with a shell reaches this unit directly whatever the
      dashboard does; what this decides is which path is the supported one. Telling a
      person's decision from a session's needs units to authenticate their callers,
      which does not exist yet &mdash; so do not read this as enforced.
    </div>
    <p class="lede">A slicing session proposed this partition. It is recorded and nothing
      exists yet &mdash; slices are created only when you ratify, and <b>slices split,
      never merge</b>, so this is close to one-way. Everything below is readable now;
      only the deciding is blocked.</p>
    <div class="cards">${cards}</div>
    ${scored?`<div class="verdict">
      <span>${s.legal===false
        ? '<span class="flag down">illegal</span> the gates would refuse this cut'
        : '<span class="flag ok">legal</span> passes every gate'}</span>
      ${wv?`<span>projected waves &nbsp;<b>${wv}</b></span>`:""}
      <span class="${un?"warnish":""}">unassigned &nbsp;<b>${un}</b>${un
        ?" entries this cut does not place \u2014 any of them currently owned by a slice "
         +"named above would hold no slice after ratifying":""}</span>
    </div>`:`<div class="verdict"><span class="warnish">not scored &mdash; deciding
      without it means deciding on the slice names alone</span></div>`}
    ${p.note?`<div class="note">${esc(p.note)}</div>`:""}
    <div class="acts">
      <button class="btn go" id="do-ratify">Ratify &mdash; create these slices</button>
      <button class="btn no" id="do-reject">Reject&hellip;</button>
      <button class="btn" id="do-preview">${
        STATE.preview?"Stop previewing":"Preview in the spine"}</button>
      <span class="spacer">Slices split and never merge &mdash; this is close to one-way.</span>
    </div>
    <div id="rejectbox"${STATE.rejectDraft.open?"":" hidden"}>
      <textarea id="reject-note" placeholder="Why is this cut wrong?">${
        esc(STATE.rejectDraft.note)}</textarea>
      <p>Required. It is kept and shown to the next slicing session as
         <code>last_rejection</code>, so it does not propose the same cut again.</p>
      <button class="btn no" id="do-reject-confirm"${
        STATE.rejectDraft.note.trim()?"":" disabled"}>Confirm rejection</button>
      <button class="btn" id="do-reject-cancel">Cancel</button>
    </div>
    <div id="outcome" hidden></div>
  </div></div>`;
}

function wireProposal(){
  if(!STATE.proposal) return;
  const g=id=>document.getElementById(id);
  g("do-preview").onclick=togglePreview;
  g("do-reject").onclick=()=>{
    STATE.rejectDraft.open=true; g("rejectbox").hidden=false; g("reject-note").focus(); };
  g("do-reject-cancel").onclick=()=>{
    // Cancel is one of the two ways a draft ends. The other is submitting.
    STATE.rejectDraft={open:false,note:""}; g("rejectbox").hidden=true;
    g("reject-note").value=""; g("do-reject-confirm").disabled=true; };
  // A rejection without a reason is one the next slicing session cannot use,
  // so it proposes the same cut again and the round is wasted.
  g("reject-note").oninput=e=>{
    STATE.rejectDraft.note=e.target.value;
    g("do-reject-confirm").disabled=!e.target.value.trim(); };
  g("do-ratify").onclick=()=>decide("ratify");
  g("do-reject-confirm").onclick=()=>decide("reject",{note:g("reject-note").value.trim()});
}

/* The only write this page makes.

   An ordinary relative POST, exactly like the reads: served at /dashboard
   it reaches this unit directly, and framed under the node it lands inside
   the proxied prefix, where the proxy forwards it because the path is one
   of the two declared at /actions. No postMessage, no node internals, and
   it still works opened standalone during development.

   Both controls are disabled for the whole round trip. Ratifying twice is
   harmless -- the second call finds no pending proposal and is refused --
   but a button that stays pressable while its own request is in flight
   invites a reader to conclude the first press did nothing. */
async function decide(what, body){
  const out=$("outcome"), ratify=$("do-ratify"), reject=$("do-reject");
  const confirm=$("do-reject-confirm");
  for(const b of [ratify,reject,confirm]) if(b) b.disabled=true;
  out.hidden=false; out.className="busy";
  out.textContent = what==="ratify" ? "Ratifying…" : "Rejecting…";
  try{
    const r=await fetch("projects/"+enc(STATE.project)+"/slicing/proposal/"+what,{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify(body||{})
    });
    const text=await r.text();
    let payload=null;
    try{ payload=JSON.parse(text); }catch(_){}
    if(!r.ok){
      out.className="bad";
      out.textContent=(payload&&payload.error)||("Refused — "+r.status+"\n\n"+text.slice(0,400));
      for(const b of [ratify,reject]) if(b) b.disabled=false;
      if(confirm) confirm.disabled=false;
      return;
    }
    // Recorded in STATE, not written into the DOM: the reload below rebuilds
    // this pane, so a confirmation living in the old markup would be
    // destroyed by the very success it is reporting.
    const flash = what==="ratify"
      ? "Ratified. "+Object.keys((payload&&payload.slices)||{}).length+
        " slices now exist. The spine, waves and legend below have been reloaded."
      : "Rejected. The reason is recorded, and the next slicing session sees it as "+
        "last_rejection so it does not propose the same cut again.";
    // Reload rather than patch: ratifying changes slice membership, which
    // changes waves, lanes, colours and the legend. Re-reading is cheaper
    // than keeping a second copy of the truth in sync.
    await selectProject(STATE.project);   // also refreshes LAST_SIG
    // Submitted: the draft is spent.
    STATE.rejectDraft={open:false,note:""};
    STATE.flash={kind:"ok",text:flash};
    drawQueues(); show("queues");
  }catch(err){
    out.className="bad";
    out.textContent="Could not reach this unit: "+err.message+
      "\n\nNothing was decided. The proposal is still pending.";
    for(const b of [ratify,reject]) if(b) b.disabled=false;
  }
}

function togglePreview(){
  STATE.preview=!STATE.preview;
  for(const e of STATE.entries){
    if(e.propSlice===undefined) continue;
    e.slice = STATE.preview ? e.propSlice : e.trueSlice;
  }
  document.getElementById("previewflag").hidden=!STATE.preview;
  focusSlice=null; sel=null;
  drawLegend(); drawScene(); resetInspector(); drawQueues();
  show("spine");
}

function drawPending(){
  const el=$("pending"), dot=$("qdot");
  if(!STATE.proposal){ el.hidden=true; dot.hidden=true; return; }
  const n=Object.keys(STATE.proposal.proposal||{}).length;
  $("pending-what").textContent=n+" slice"+(n===1?"":"s")+" proposed for "+STATE.project;
  el.hidden=false; dot.hidden=false;
  $("pending-go").onclick=()=>{
    show("queues");
    const d=document.querySelector(".decide");
    if(d) d.scrollIntoView({block:"start"});
  };
}

function drawQueues(){
  const reqs=STATE.requests, iss=STATE.issues;
  const open=reqs.filter(r=>r.status==="pending").length;
  const live=iss.filter(i=>i.status!=="resolved").length;
  const f=STATE.flash;
  $("queues").innerHTML= (f?`<div class="flash ${f.kind}">${esc(f.text)}`+
      `<button id="flash-x" title="dismiss">&times;</button></div>`:"")+
    proposalHTML()+
  `<div class="qsec"><h3>Requests <span class="n">${open} pending</span>
     <span class="muted" style="font-weight:400">the single external door</span></h3>`+
  (reqs.length?`<table><tr><th>id</th><th>type</th><th>title</th><th>status</th><th>at</th></tr>`+
   reqs.map(r=>`<tr><td><code>${esc(r.id)}</code></td><td>${esc(r.type)}</td>
     <td>${esc(r.title)}</td>
     <td><span class="flag ${r.status==="pending"?"warn":r.status==="rejected"?"down":"ok"}">${
       esc(r.status)}</span></td>
     <td class="muted">${when(r.at)}</td></tr>`).join("")+`</table>`
   :`<p class="muted">Nothing in the queue.</p>`)+`</div>`+
  `<div class="qsec"><h3>Issues <span class="n">${live} open</span>
     <span class="muted" style="font-weight:400">one part of the pipeline asking
     another</span></h3>`+
  (iss.length?`<table>
   <tr><th>id</th><th>target</th><th>slice</th><th>kind</th><th>claim</th><th>round</th><th></th></tr>`+
   iss.map(i=>`<tr><td><code>${esc(i.id)}</code></td>
     <td><button class="pill" data-goto="${esc(i.target)}">${esc(i.target)}</button></td>
     <td>${esc(i.target_slice||"—")}</td><td>${esc(i.kind)}</td><td>${esc(i.claim)}</td>
     <td>${esc(i.round==null?"":i.round)}</td>
     <td><span class="flag ${i.status==="escalated"?"down":i.status==="resolved"?"ok":"warn"}">${
       esc(i.status)}</span></td></tr>`).join("")+`</table>`
   :`<p class="muted">No issues raised.</p>`)+
  `<p class="muted" style="max-width:64ch">A <b>semantic</b> issue invalidates the entries that
   consumed the old meaning — that set is the re-run scope, computed at entry level. An
   <b>additive</b> one re-runs nothing. Round 2 with nothing resolved escalates to a
   human.</p></div>`;
  const x=$("flash-x"); if(x) x.onclick=()=>{ STATE.flash=null; drawQueues(); };
  wireProposal();
  restoreDraftFocus();
}

/* Rendering from STATE preserves the text; it does not preserve where the
   caret was or that the field had focus. Both are the reader's, and a
   refresh that drops them mid-sentence is the same theft in a smaller
   form. */
let DRAFT_CARET = null;
function captureDraftFocus(){
  const n=$("reject-note");
  DRAFT_CARET = (n && document.activeElement===n)
    ? {start:n.selectionStart, end:n.selectionEnd} : null;
}
function restoreDraftFocus(){
  if(!DRAFT_CARET) return;
  const n=$("reject-note");
  if(n){ n.focus(); try{ n.setSelectionRange(DRAFT_CARET.start, DRAFT_CARET.end); }catch(_){} }
  DRAFT_CARET=null;
}

/* One delegated handler for every id link on the page: an identifier
   interpolated into an inline onclick would be markup built from
   stored data, which is the thing esc() exists to avoid. */
document.addEventListener("click",e=>{
  const n=e.target.closest(".node");
  if(n){ pick(n.dataset.id); return; }
  const b=e.target.closest("[data-goto]");
  if(!b) return;
  show("spine"); pick(b.dataset.goto);
});

/* =============================================================
   RAIL, VIEWS, PAN/ZOOM
   ============================================================= */
function drawLegend(){
  const names=Object.keys(STATE.slices);
  const unsliced=STATE.entries.filter(e=>e.slice==="unsliced").length;
  $("legend").innerHTML = (names.length||unsliced)
    ? names.map(s=>{
        const i=STATE.slices[s];
        return `<button class="leg ${i.type==="cross_cutting"?"xc":""}" data-s="${esc(s)}"
          style="--sl:${i.hue}" aria-pressed="false" title="${
            i.wave==null?"":"wave "+i.wave}"><i></i>${esc(s)}<em>${i.size}</em></button>`;}).join("")+
      (unsliced?`<button class="leg" data-s="unsliced" style="--sl:${UNSLICED}"
          aria-pressed="false"><i></i>unsliced<em>${unsliced}</em></button>`:"")
    : `<p class="muted" style="padding:0 9px">none yet</p>`;

  for(const b of $("legend").querySelectorAll(".leg")) b.onclick=()=>{
    focusSlice = focusSlice===b.dataset.s ? null : b.dataset.s;
    sel=null; resetInspector();          // the other mode releases
    syncLegend();
    if(MODE==="read"){ drawRead(); return; }
    repaint();
    if(focusSlice){
      const ids=STATE.entries.filter(e=>e.slice===focusSlice).map(e=>e.id)
        .filter(i=>SCENE&&SCENE.pos.has(i));
      if(!ids.length){ fit(); return; }
      const xs=ids.map(i=>SCENE.pos.get(i).x), ys=ids.map(i=>SCENE.pos.get(i).y);
      fitTo({x:Math.min(...xs)-20,y:Math.min(...ys)-NODE_H,
             width:Math.max(...xs)-Math.min(...xs)+NODE_W+40,
             height:Math.max(...ys)-Math.min(...ys)+NODE_H*2});
    } else fit();
  };
}

function show(v){
  for(const b of document.querySelectorAll("nav .view"))
    b.setAttribute("aria-current",b.dataset.v===v);
  const onCanvas = v==="spine" || v==="order";
  const reading = v==="read";
  $("canvas").classList.toggle("hide",!onCanvas);
  $("read").classList.toggle("hide",!reading);
  $("waves").classList.toggle("hide",v!=="waves");
  $("modules").classList.toggle("hide",v!=="modules");
  $("queues").classList.toggle("hide",v!=="queues");
  $("viewbar").hidden = !(onCanvas||reading);
  $("vb-spine").hidden = v!=="spine";
  $("vb-order").hidden = v!=="order";
  $("vb-read").hidden  = !reading;
  if(onCanvas && v!==MODE){
    MODE=v; sel=null; focusSlice=null;
    syncLegend(); drawScene(); resetInspector();
  }
  // The inspector becomes the outline while reading, and has to be given
  // back when leaving -- it is the same column serving two jobs.
  if(reading){ MODE="read"; sel=null; drawRead(); }
  else if(MODE==="read" && !onCanvas){ MODE="spine"; resetInspector(); }
}
for(const b of document.querySelectorAll("nav .view")) b.onclick=()=>show(b.dataset.v);
$("t-h").onchange=repaint;
$("t-e").onchange=repaint;
for(const b of document.querySelectorAll("#lay-seg .segb"))
  b.onclick=()=>{ LAYOUT=b.dataset.lay; sel=null; focusSlice=null;
    for(const o of document.querySelectorAll("#lay-seg .segb"))
      o.setAttribute("aria-pressed", o.dataset.lay===LAYOUT);
    syncLegend(); drawScene(); resetInspector(); };
$("ord-layer").onchange=()=>{ ORDER_LAYER=+$("ord-layer").value; sel=null;
  syncLegend(); drawOrder(); resetInspector(); };
$("rd-layer").onchange=()=>{ RD_LAYER=$("rd-layer").value; drawRead(); };
// Debounced: every keystroke re-renders the whole document otherwise.
let rdTimer=null;
$("rd-find").oninput=e=>{ RD_FIND=e.target.value;
  clearTimeout(rdTimer); rdTimer=setTimeout(drawRead,160); };
$("read").addEventListener("scroll",()=>{ if(MODE==="read") markRead(); });
addEventListener("keydown",e=>{ if(e.key==="Escape") clearAll(); });

(()=>{
  const c=$("canvas"); let down=null, moved=0;
  c.addEventListener("pointerdown",e=>{
    if(e.target.closest(".node")||e.target.closest("button")) return;
    down={x:e.clientX-view.x,y:e.clientY-view.y}; moved=0; c.classList.add("dragging");});
  addEventListener("pointermove",e=>{ if(!down)return;
    moved=Math.max(moved,Math.abs(e.clientX-down.x-view.x)+Math.abs(e.clientY-down.y-view.y));
    view.x=e.clientX-down.x; view.y=e.clientY-down.y; applyView();});
  // A press on blank canvas that did not become a drag is a click,
  // and a click on nothing means "I am looking at nothing".
  addEventListener("pointerup",()=>{
    if(down && moved<4) clearAll();
    down=null; c.classList.remove("dragging")});
  c.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=c.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const k=Math.min(2.4,Math.max(0.22,view.k*(e.deltaY<0?1.12:0.89)));
    view.x=mx-(mx-view.x)*(k/view.k); view.y=my-(my-view.y)*(k/view.k);
    view.k=k; applyView();},{passive:false});
  $("zin").onclick=()=>{view.k=Math.min(2.4,view.k*1.2);applyView()};
  $("zout").onclick=()=>{view.k=Math.max(0.22,view.k/1.2);applyView()};
  $("zfit").onclick=()=>{fit()};
})();


/* =============================================================
   STAYING CURRENT

   UNIT_STANDARDS.md, "Staying current: a dashboard refreshes itself,
   and it does so quietly". The node cannot do this for a page-tier
   unit -- its only lever is reloading the frame, which would throw away
   pan, zoom, selection, the outline's position and any half-typed text.

   The rule carrying the weight is the cheapest one: keep the last
   payload and, if the new one is identical, touch nothing. Most polls
   find no change, so the common case costs one string comparison and
   cannot flicker.
   ============================================================= */
const POLL_MS = 10000;          // rule 8: matches the node's own chrome
const BACKOFF_MAX = 60000;
let LAST_SIG = null;            // what the unit last said
let KEEP_VIEW = false;          // suppresses fit() during a poll redraw
let POLL_TIMER = null, POLL_WAIT = POLL_MS, LAST_OK = 0, POLL_FAIL = 0;
let FRESH_TICK = null;

/* Rule 4, and only its first half. TRANSIENT interaction pauses the
   refresh: a drag, an open menu, a click already in flight. Each resolves
   in seconds on its own.

   Uncommitted input does NOT pause, and the first version of this got that
   wrong: it also held the poll while a rejection note had any content,
   which meant one character and a wandering reader froze the page
   indefinitely with nothing on screen to explain it. That input is
   protected by being rendered from STATE instead -- reconciliation cannot
   overwrite what it does not author -- and the same is true of the read
   filter, which lives in RD_FIND and is reapplied on every draw. */
function readerIsBusy(){
  if(POINTER_DOWN) return true;                       // a click in flight
  if($("canvas").classList.contains("dragging")) return true;
  const a = document.activeElement;
  if(a && a.tagName === "SELECT") return true;        // an open menu
  return false;
}
let POINTER_DOWN = false;
addEventListener("pointerdown", ()=>{ POINTER_DOWN=true; }, true);
addEventListener("pointerup",   ()=>{ POINTER_DOWN=false; }, true);
addEventListener("pointercancel", ()=>{ POINTER_DOWN=false; }, true);

function markFresh(){ LAST_OK = Date.now(); POLL_FAIL = 0; POLL_WAIT = POLL_MS; drawFresh(); }

function drawFresh(){
  const el = $("fresh"), t = $("fresh-t");
  if(!el) return;
  if(!LAST_OK){ t.textContent = "connecting…"; el.className = "paused"; return; }
  const age = Math.round((Date.now() - LAST_OK) / 1000);
  // Rule 6: a dashboard that keeps showing its last good data while the
  // unit is unreachable is lying. Say how old it is.
  if(POLL_FAIL){
    el.className = "stale";
    t.textContent = "unreachable · " + (age < 90 ? age + "s" : Math.round(age/60) + "m") + " old";
  }else if(readerIsBusy()){
    el.className = "paused";
    t.textContent = "paused";
  }else{
    el.className = "";
    t.textContent = age < 12 ? "live" : "updated " + (age < 90 ? age + "s" : Math.round(age/60) + "m") + " ago";
  }
}

/* Rule 3 at the only granularity this page has: seven independent
   regions, each redrawn only when the thing it draws actually moved. A
   changed issue must not reflow the graph. */
function reconcile(d){
  const was = LAST_SIG, now = signatures(d);
  if(was && Object.keys(now).every(k => now[k] === was[k])) return false;  // rule 1

  const fresh = was
    ? new Set(d.entries.filter(e => !STATE.byId[e.id]).map(e => e.id))
    : new Set();

  const changed = k => !was || was[k] !== now[k];
  const structural = changed("graph") || changed("slices") || changed("proposal");

  applyProject(d);
  LAST_SIG = now;

  KEEP_VIEW = true;                       // rule 2, for the whole redraw
  try{
    if(changed("strip") || changed("gates")) drawStrip();
    if(changed("proposal")) drawPending();
    if(structural){ drawLegend(); drawLayerPicker(); drawReadPicker(); }
    if(structural && MODE !== "read"){
      drawScene();
      // drawScene rebuilds every node, discarding the classes that carry
      // the reader's selection and slice focus. Without this the graph
      // silently un-dims itself on the tick that adds an entry.
      repaint();
    }
    if(structural && MODE === "read"){ for(const k of Object.keys(READ_CACHE)) delete READ_CACHE[k];
                                       drawReadKeepingPlace(); }
    if(changed("waves") || changed("slices") || changed("units")) drawWaves();
    // Coverage moves when a module is declared, and also when the spec layer
    // grows underneath an unchanged module map -- so it watches the graph too.
    if(changed("modules") || structural) drawModules();
    if(changed("queues") || changed("proposal")){ captureDraftFocus(); drawQueues(); }
  } finally { KEEP_VIEW = false; }

  if(fresh.size) markNew(fresh);
  return true;
}

/* Rule 7's second half: mark what is new, briefly. Without it a swap is
   indistinguishable from nothing having happened, and the reader keeps
   reloading by hand -- the exact problem this exists to solve. */
function markNew(ids){
  for(const n of $("scene").querySelectorAll(".node"))
    if(ids.has(n.dataset.id)) n.classList.add("new");
  for(const a of $("read").querySelectorAll("article"))
    if(ids.has(a.dataset.id)) a.classList.add("new");
  setTimeout(()=>{
    for(const n of document.querySelectorAll(".node.new,.new")) n.classList.remove("new");
  }, 2600);
}

/* The Read view is the awkward one. Its document is long, and a reflow
   while someone is reading moves the text under their eyes -- an entry
   above the viewport gaining a comment shifts everything below it.

   So the anchor is the ENTRY at the top of the viewport, not a scroll
   offset: find it, redraw, then put that same entry back where it was.
   An offset survives nothing; an identifier survives insertions above
   it, which is the case that actually happens. */
async function drawReadKeepingPlace(){
  const el = $("read");
  const arts = [...el.querySelectorAll("article")];
  const top = el.scrollTop;
  let anchorId = null, delta = 0;
  for(const a of arts){
    if(a.offsetTop + a.offsetHeight > top){ anchorId = a.dataset.id; delta = a.offsetTop - top; break; }
  }
  await drawRead();
  if(!anchorId) return;
  const again = el.querySelector('article[data-id="' + CSS.escape(anchorId) + '"]');
  // Instant, never smooth. The pane animates scrolling because an outline
  // click should glide; restoring a position the reader never left must
  // not, or the document slides under their eyes on every tick.
  // Two frames: the first lets the rebuilt document lay out, the second
  // re-asserts the position after any late reflow. One frame was enough in
  // a test and not in use, which is the failure this whole section warns
  // about.
  if(!again) return;
  const put = () => { el.scrollTop = again.offsetTop - delta; };
  put();
  requestAnimationFrame(()=>{ put(); requestAnimationFrame(put); });
}

async function tick(){
  // Rule 5: a forgotten tab polling every unit forever is a cost nobody
  // ever sees. A frame inherits the parent's visibility, so this is free.
  if(document.visibilityState === "hidden") return schedulePoll();
  if(readerIsBusy()){ drawFresh(); return schedulePoll(); }
  if(!STATE.project || !STATE.live) return schedulePoll();
  try{
    const d = await fetchProject(STATE.project);
    reconcile(d);
    markFresh();
  }catch(err){
    // Rule 6: widen rather than hammer a unit that is already down.
    POLL_FAIL++;
    POLL_WAIT = Math.min(BACKOFF_MAX, POLL_MS * Math.pow(2, Math.min(POLL_FAIL, 3)));
    drawFresh();
  }
  schedulePoll();
}

function schedulePoll(){
  clearTimeout(POLL_TIMER);
  POLL_TIMER = setTimeout(tick, POLL_WAIT);
}

function startPolling(){
  schedulePoll();
  clearInterval(FRESH_TICK);
  FRESH_TICK = setInterval(drawFresh, 1000);   // the label ages; the data does not
  document.addEventListener("visibilitychange", ()=>{
    // Refresh once on return rather than waiting out the interval.
    if(document.visibilityState === "visible"){ POLL_WAIT = POLL_MS; clearTimeout(POLL_TIMER);
                                                POLL_TIMER = setTimeout(tick, 250); }
  });
}

/* =============================================================
   STRIP + BOOT
   ============================================================= */
function drawStrip(){
  const g=STATE.gates;
  const sound=$("f-sound"), comp=$("f-complete");
  if(!g){ sound.textContent="gates unknown"; sound.className="flag warn";
          comp.textContent=""; comp.className="flag hide"; }
  else{
    sound.textContent = g.sound ? "sound" : "UNSOUND";
    sound.className   = "flag " + (g.sound ? "ok" : "down");
    const unserved=(g.findings||[]).filter(f=>f.kind==="unserved").length;
    comp.textContent = g.complete ? "complete"
      : "incomplete" + (unserved ? " · " + unserved + " unserved" : "");
    comp.className   = "flag " + (g.complete ? "ok" : "warn");
  }
  $("k-entries").textContent=STATE.entries.filter(e=>!e.module).length;
  $("k-slices").textContent=Object.keys(STATE.slices).length;
  /* Coverage as a number, not as a badge on every node. Before the first
     scenario exists every contract is untested, and thirty identical
     badges say only that the project has not got there yet -- which this
     says once. */
  $("k-tests").textContent=STATE.entries.filter(e=>e.test&&!e.module).length;
  $("k-untested").textContent=STATE.untested.length;
  $("kpi-untested").classList.toggle("warnkpi",
    hasTests() && STATE.untested.length>0);
  $("k-issues").textContent=STATE.issues.filter(i=>i.status==="open").length;
  $("k-loc").textContent=STATE.locality==null?"–":Number(STATE.locality).toFixed(2);
}

/* Only layers that hold entries, and each labelled with whether it has any
   dependencies at all -- offering Intent here would promise a dependency
   view of a layer that structurally cannot have one. */
function drawLayerPicker(){
  const sel=$("ord-layer");
  const opts=LAYERS.map((L,i)=>({i,name:L[1],
      n:STATE.entries.filter(e=>e.layer===i).length,
      d:STATE.entries.filter(e=>e.layer===i).reduce((a,e)=>a+e.deps.length,0)}))
    .filter(o=>o.n>0 && o.i!==TEST_LAYER);
  sel.innerHTML=opts.map(o=>
    `<option value="${o.i}">${esc(o.name)} · ${o.n} entries${
      o.d?" · "+o.d+" deps":" · no dependencies"}</option>`).join("");
  // Open on the layer with the most to show, not the first that exists.
  const best=opts.filter(o=>o.d>0).sort((a,b)=>b.d-a.d)[0] || opts[0];
  if(best && !opts.some(o=>o.i===ORDER_LAYER && o.d>0)) ORDER_LAYER=best.i;
  if(opts.length) sel.value=String(ORDER_LAYER);
}

function drawReadPicker(){
  const sel=$("rd-layer");
  const opts=readOrder().map(l=>({l,name:LAYERS[LIX[l]][1],
    n:STATE.entries.filter(e=>e.id[0]===l).length}));
  sel.innerHTML=`<option value="*">everything · ${
    opts.reduce((a,o)=>a+o.n,0)} entries</option>`+
    opts.map(o=>`<option value="${o.l}">${esc(o.name)} · ${o.n}</option>`).join("");
  sel.value=RD_LAYER;
}

function redraw(){
  drawStrip(); drawPending(); drawLegend(); drawLayerPicker(); drawReadPicker();
  drawScene(); drawWaves(); drawModules(); drawQueues();
  clearAll();
}

async function selectProject(p){
  // A different project means different bodies; keeping the old ones would
  // render one project's document under another project's name.
  for(const k of Object.keys(READ_CACHE)) delete READ_CACHE[k];
  STATE.bodies = {};
  try{
    const d = await fetchProject(p);
    applyProject(d);
    LAST_SIG = signatures(d);
    markFresh();
  }catch(err){
    $("offline").hidden=false;
    $("offline").textContent="Could not load "+p+": "+err.message;
    Object.assign(STATE,{entries:[],byId:{},slices:{},waves:[],gates:null,
                         issues:[],requests:[],modules:[],locality:null});
  }
  redraw();
}

(async ()=>{
  resetInspector();
  let projects=[];
  try{
    projects=await loadProjects();
    STATE.live=true;
  }catch(err){
    STATE.live=false;
    $("offline").hidden=false;
    $("offline").textContent=
      "Not connected to a running mu-spec — this unit's API did not answer. "+
      "Everything below is empty rather than wrong.";
  }
  STATE.projects=projects;
  const sel=$("proj");
  sel.innerHTML=projects.length
    ? projects.map(p=>`<option>${esc(p)}</option>`).join("")
    : `<option>— no projects —</option>`;
  sel.onchange=()=>selectProject(sel.value);
  if(projects.length) await selectProject(projects[0]);
  else redraw();
  if(STATE.live) startPolling();
  drawFresh();
})();

addEventListener("resize",()=>{ if(!focusSlice) fit(); });
</script>
