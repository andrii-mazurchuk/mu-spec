<!doctype html>
<meta charset="utf-8">
<meta name="holonic-tokens" content="1">
<title>mu-spec</title>
<style>
/* Own palette as the standalone default; the node overwrites these on the
   frame's root element when this page is served under the console, so the
   reader's chosen theme wins there. Names come from the token contract --
   a name not in the contract is never injected. */
:root{
  --ground:#f6f6f4; --panel:#fff; --panel-alt:#f0efec; --panel-3:#e7e5e1;
  --ink:#1b1a18; --ink-soft:#4a4843; --dim:#8a877f;
  --rule:#d9d6d0; --rule-soft:#eceae6;
  --brand:#2f6f6b; --brand-ink:#fff; --brand-soft:#2f6f6b22;
  --ok:#2e7d4f; --warn:#9a6b12; --down:#a13a2c;
  --ok-bg:#2e7d4f1f; --warn-bg:#9a6b121f; --down-bg:#a13a2c1f;
  --shadow:0 1px 2px #0000000f; --radius:8px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  color-scheme:light;
}
/* Standalone fallback only. Framed, the node's injected .dark class is the
   answer and this must not fight the reader's own choice. */
@media (prefers-color-scheme:dark){:root:not(.light){
  --ground:#141413; --panel:#1c1c1a; --panel-alt:#232321; --panel-3:#2b2b28;
  --ink:#eceae6; --ink-soft:#b9b6b0; --dim:#807d76;
  --rule:#343430; --rule-soft:#262624; --brand:#6fb3ad; --brand-ink:#101010;
  --brand-soft:#6fb3ad26; --ok:#6bbf8c; --warn:#d2a33f; --down:#d6705e;
  --ok-bg:#6bbf8c24; --warn-bg:#d2a33f24; --down-bg:#d6705e24;
  color-scheme:dark;
}}
:root.dark{
  --ground:#141413; --panel:#1c1c1a; --panel-alt:#232321; --panel-3:#2b2b28;
  --ink:#eceae6; --ink-soft:#b9b6b0; --dim:#807d76;
  --rule:#343430; --rule-soft:#262624; --brand:#6fb3ad; --brand-ink:#101010;
  --brand-soft:#6fb3ad26; --ok:#6bbf8c; --warn:#d2a33f; --down:#d6705e;
  --ok-bg:#6bbf8c24; --warn-bg:#d2a33f24; --down-bg:#d6705e24;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 var(--sans);
  height:100vh;display:flex;flex-direction:column;overflow:hidden}

.bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;flex:none;
  padding:9px 16px;border-bottom:1px solid var(--rule);background:var(--panel)}
.bar select{background:var(--panel-alt);color:var(--ink);border:1px solid var(--rule);
  border-radius:var(--radius);padding:4px 8px;font:inherit;max-width:220px}
.kpi{display:flex;flex-direction:column;line-height:1.15}
.kpi b{font-size:15px;font-variant-numeric:tabular-nums}
/* Only once testing has started. An all-untested project is not a
   project in trouble, it is a project that has not reached tests. */
.kpi.warnkpi b{color:var(--warn)}
.kpi span{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.flag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}
.warn{background:var(--warn-bg);color:var(--warn)}
.down{background:var(--down-bg);color:var(--down)}
#offline{flex:none;padding:7px 16px;background:var(--warn-bg);color:var(--warn);font-size:12.5px}
#offline[hidden]{display:none}

main{flex:1;display:grid;grid-template-columns:190px 1fr 330px;min-height:0}

nav{border-right:1px solid var(--rule);padding:12px 10px;background:var(--panel);
  overflow:auto;display:flex;flex-direction:column;gap:4px}
nav button.view{display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--ink-soft);font:inherit;padding:6px 9px;border-radius:var(--radius);cursor:pointer}
nav button.view[aria-current=true]{background:var(--brand-soft);color:var(--brand);font-weight:600}
nav h2{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  margin:18px 0 6px;padding:0 9px}
.leg{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;cursor:pointer;
  font:inherit;color:var(--ink-soft);padding:4px 9px;border-radius:var(--radius);text-align:left}
.leg:hover{background:var(--panel-alt)}
.leg[aria-pressed=true]{background:var(--brand-soft);color:var(--ink);font-weight:600}
.leg i{width:9px;height:9px;border-radius:2px;background:var(--sl);flex:none}
.leg em{font-style:normal;color:var(--dim);font-size:11px;margin-left:auto;
  font-variant-numeric:tabular-nums}
.leg.xc i{border-radius:99px}
label.tog{display:flex;gap:7px;align-items:center;padding:4px 9px;color:var(--ink-soft);font-size:13px}
label.tog em{font-style:normal;color:var(--dim);font-size:11px;margin-left:auto;
  font-variant-numeric:tabular-nums}

.stage{position:relative;min-width:0;overflow:hidden}
.canvas{position:absolute;inset:0;cursor:grab;overflow:hidden}
.canvas.dragging{cursor:grabbing}
.canvas svg{display:block;width:100%;height:100%}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;z-index:2}
.zoom button{width:28px;height:28px;border:1px solid var(--rule);background:var(--panel);
  color:var(--ink-soft);border-radius:6px;cursor:pointer;font:13px var(--sans);box-shadow:var(--shadow)}
.hint{position:absolute;left:14px;bottom:12px;color:var(--dim);font-size:11px;z-index:2;
  pointer-events:none;max-width:58%}
.pane{position:absolute;inset:0;overflow:auto;padding:20px 24px;background:var(--ground)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:13px;text-align:center;padding:0 40px}
.hide{display:none}

.colhead{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;fill:var(--dim)}
.colrule{stroke:var(--rule-soft);stroke-width:1}
.node rect{fill:var(--panel);stroke:var(--rule);stroke-width:1;rx:6}
.node .accent{fill:var(--sl);stroke:none}
.node .id{font:600 11px var(--mono);fill:var(--ink)}
.node .sl{font:500 10px var(--mono);fill:var(--sl)}
.node .t{font:11.5px var(--sans);fill:var(--ink-soft)}
.node{cursor:pointer}
.node:hover rect{stroke:var(--brand)}
.node.sel rect{stroke:var(--brand);stroke-width:2}
.node.mod rect{stroke-dasharray:3 3}
.node.dim{opacity:.16}

/* ── the verification band ───────────────────────────────────────
   A second ROW, not a continuation of the columns above. The rule
   across the full width is what says so before any label does. */
.bandrule{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:2 6}
.bandcap{font:600 11px var(--sans);letter-spacing:.09em;
  text-transform:uppercase;fill:var(--dim)}

/* A GHOST is a copy of a spec entry, drawn beneath the corpus so the
   spec-to-test edge is one short hop instead of an arc across the
   whole picture. It is a reference, never a second entry, so it is
   drawn as an outline with nothing filled in. */
.node.ghost rect{fill:none;stroke-dasharray:1 4;stroke:var(--rule);
  pointer-events:all}
.node.ghost .accent{opacity:.45}
.node.ghost .id{fill:var(--ink-soft)}
.node.ghost .t{fill:var(--dim);font-style:italic}

/* A scenario. Squarer than an entry on purpose: it is a different
   kind of thing, and the shape says that before the colour does. */
.node.tst rect{rx:2}

/* Written, no file yet. Emphatically NOT a failure state -- it is not
   yet expected to pass, and nothing waits on it -- so it is drawn as
   unfinished rather than as broken: no fill, never a warning colour. */
.node.unbuilt rect{fill:none;stroke-dasharray:5 3;pointer-events:all}
.node.unbuilt .t{fill:var(--dim)}

/* A contract nothing says how to falsify. Shown only once testing has
   started; before the first scenario exists every contract is
   untested and badging all of them says nothing. */
.node.untested .accent{fill:none;stroke:var(--sl);stroke-width:1;
  stroke-dasharray:3 3}

/* Work units on the spine, on demand. A unit groups entries and files
   across columns and across both bands, so a hull or a column would
   assert an adjacency the graph does not have. Selecting anything
   lights the rest of the branch it would be built on instead. */
.node.peer rect{stroke:var(--brand);stroke-width:1.5;stroke-dasharray:4 2}
.far .t{display:none}
.edge{fill:none;stroke:var(--rule);stroke-width:1.4;marker-end:url(#a-idle)}
.edge.e{stroke-dasharray:3 4}
.edge.lit{stroke:var(--brand);stroke-width:2;marker-end:url(#a-lit)}
.edge.lit.h{stroke:var(--warn);marker-end:url(#a-h)}
.edge.dim{opacity:.12}
.edge.off{display:none}

.wave{display:flex;gap:12px;align-items:stretch;margin-bottom:14px;flex-wrap:wrap}
.wave .lbl{width:78px;color:var(--dim);font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;padding-top:12px;flex:none}
.slice{background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--sl);
  border-radius:var(--radius);padding:9px 12px;min-width:180px;box-shadow:var(--shadow)}
.slice b{display:block}
.slice em{font-style:normal;color:var(--dim);font-size:11px;display:block;margin-top:2px}
.slice code{font-size:10.5px;color:var(--dim)}

/* ── work units in the waves view ───────────────────────────────── */
.wave .unitbody{flex:1;display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start;
  background:var(--panel-alt);border-radius:var(--radius);padding:7px;min-height:40px}
.unitchip{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--sl);
  border-radius:var(--radius);padding:7px 10px;box-shadow:var(--shadow);cursor:pointer;
  display:block;text-align:left;font:inherit;min-width:198px;max-width:264px}
.unitchip:hover{border-color:var(--brand)}
.unitchip[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.unitchip b{display:block;font:600 11.5px var(--mono);color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.unitchip .more{display:block;font:11px var(--mono);color:var(--dim);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.unitchip .facts{display:flex;gap:9px;margin-top:5px;flex-wrap:wrap}
.unitchip em{font-style:normal;font-size:10.5px;color:var(--dim)}
/* No single owning slice: colouring it by one of them would report an owner
   it does not have. */
.unitchip.multi{border-left-color:var(--warn)}
.unitchip.multi em:last-child{color:var(--warn)}
/* Files that depend on each other and so cannot be built separately. */
.unitchip.cyc{border-style:dashed}
.wwidth{align-self:center;background:var(--panel-3);border-radius:99px;padding:0 7px;
  font-size:10.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.earlynote{border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:0 6px 6px 0;
  padding:9px 12px;margin:0 0 16px;font-size:12.5px;color:var(--ink-soft);max-width:74ch}
.earlynote b{color:var(--warn);display:block;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:3px}
h3.again{margin-top:34px}
.cutbar{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.cutbar .muted{max-width:56ch}
.cutbtn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:var(--radius);
  padding:6px 14px;font:600 13px var(--sans);cursor:pointer;flex:none}
.cutbtn:hover{filter:brightness(1.08)}
.cutbtn:disabled{opacity:.55;cursor:default}
#cutflash{margin:0 0 14px;padding:9px 12px;border-radius:var(--radius);font-size:12.5px;
  white-space:pre-wrap;max-width:74ch}
#cutflash.ok{background:var(--ok-bg);color:var(--ok)}
#cutflash.bad{background:var(--down-bg);color:var(--down)}
#cutflash.busy{background:var(--panel-alt);color:var(--ink-soft)}

/* ── modules ────────────────────────────────────────────────────── */
/* The gate reads first, because that is the question: a spec entry no
   module claims is work nobody can be given, so the ticket step cannot
   start. Everything below it is the detail behind that one verdict. */
.gate{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:var(--radius);
  margin-bottom:20px;border:1px solid var(--rule)}
.gate b{font-size:15px;display:block}
.gate em{font-style:normal;font-size:12.5px;color:var(--ink-soft);display:block;margin-top:2px}
.gate.blocked{background:var(--warn-bg);border-color:var(--warn)}
.gate.blocked b{color:var(--warn)}
.gate.open{background:var(--ok-bg);border-color:var(--ok)}
.gate.open b{color:var(--ok)}
.gate .big{font:600 27px/1 var(--sans);font-variant-numeric:tabular-nums;flex:none;
  min-width:74px;text-align:center}

.modslice{margin-bottom:22px;border:1px solid var(--rule);border-left:3px solid var(--sl);
  border-radius:var(--radius);background:var(--panel);overflow:hidden}
.modslice > h4{margin:0;padding:8px 13px;background:var(--panel-alt);font:600 12.5px var(--sans);
  color:var(--ink);display:flex;align-items:center;gap:9px}
.modslice > h4 em{font-style:normal;color:var(--dim);font-size:11px;font-weight:500;
  margin-left:auto;font-variant-numeric:tabular-nums}
.specrow{display:flex;gap:12px;align-items:flex-start;padding:7px 13px;
  border-top:1px solid var(--rule-soft)}
.specrow code{font:600 11.5px var(--mono);color:var(--ink);flex:none;padding-top:1px;width:46px}
.specrow .ttl{flex:1;min-width:0;font-size:12.5px;color:var(--ink-soft)}
.specrow .files{flex:none;max-width:47%;text-align:right}
.specrow.gap{background:var(--warn-bg)}
.specrow.gap .ttl{color:var(--ink)}
.nofile{font:500 11.5px var(--mono);color:var(--warn)}
.file{display:inline-block;background:var(--panel-alt);border:1px solid var(--rule);
  border-radius:5px;padding:1px 6px;margin:1px 0 1px 4px;font-family:var(--mono);
  font-size:11.5px;color:var(--ink);cursor:pointer}
.file:hover{border-color:var(--brand);color:var(--brand)}
.file.shared{border-color:var(--warn);color:var(--warn)}

table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:24px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;padding:5px 7px;border-bottom:1px solid var(--rule)}
td{padding:6px 7px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
code{font-family:var(--mono);font-size:12px}
h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}

aside{border-left:1px solid var(--rule);background:var(--panel);padding:16px;overflow:auto}
aside h3{margin:18px 0 8px}
aside h3:first-child{margin-top:0}
.body{white-space:pre-wrap;background:var(--panel-alt);border-radius:var(--radius);
  padding:9px 10px;font-size:12.5px;color:var(--ink-soft);margin:8px 0 4px;
  max-height:44vh;overflow:auto}
.edgelist{margin:0 0 12px}
.edgelist span{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  display:block;margin-bottom:3px}
.pill{display:inline-block;background:var(--panel-alt);border:1px solid var(--rule);
  border-radius:5px;padding:1px 6px;margin:2px 3px 0 0;font-family:var(--mono);font-size:11.5px;
  cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--brand);color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.segb{background:var(--panel);border:0;border-right:1px solid var(--rule);
  color:var(--ink-soft);padding:3px 11px;font:500 11.5px var(--sans);cursor:pointer}
.segb:last-child{border-right:0}
.segb[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.jump{background:var(--panel-alt);border:1px solid var(--rule);color:var(--ink-soft);
  border-radius:5px;padding:3px 9px;font:500 11.5px var(--sans);cursor:pointer;margin-left:10px}
.jump:hover{border-color:var(--brand);color:var(--brand)}
.pill.flat{cursor:default;color:var(--ink-soft)}
.pill.flat:hover{border-color:var(--rule);color:var(--ink-soft)}
.tstag{color:var(--brand);font:600 10px var(--mono);letter-spacing:.04em}
.muted{color:var(--dim);font-size:12px}
.warnish{color:var(--warn)}

/* ── freshness ──────────────────────────────────────────────────── */
#fresh{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px;
  margin-left:auto;white-space:nowrap}
#fresh .pip{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
#fresh.stale{color:var(--warn)}
#fresh.stale .pip{background:var(--warn)}
#fresh.paused .pip{background:var(--dim)}
/* Rule 7: a silent swap is indistinguishable from nothing happening. */
@keyframes newly{from{background:var(--brand-soft)}to{background:transparent}}
.node.new rect{stroke:var(--brand);stroke-width:2}
#read article.new,#queues tr.new,.flash.new{animation:newly 2.4s ease-out}

/* ── the read view ──────────────────────────────────────────────── */
/* No scroll-behavior here on purpose: a container that animates every
   scrollTop assignment makes restoring a reading position after a
   reflow non-deterministic. Smooth is opted into per gesture below,
   where it is wanted. */
#read{position:absolute;inset:0;overflow:auto;background:var(--ground)}
#read .doc{max-width:88ch;margin:0 auto;padding:64px 34px 60vh}
#read h1{font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:0 0 4px;padding-top:26px}
#read .layerhead{border-top:1px solid var(--rule);margin-top:34px;padding-top:0}
#read .layerhead:first-child{border-top:0;margin-top:0}
#read h1 b{display:block;font:600 21px var(--sans);letter-spacing:0;text-transform:none;
  color:var(--ink);margin-top:6px}
#read h2{font:600 13px var(--sans);color:var(--sl);margin:26px 0 2px;
  display:flex;align-items:baseline;gap:8px}
#read h2 .tag{font:500 10px var(--mono);color:var(--dim);letter-spacing:.06em;
  text-transform:uppercase}
#read .sliceline{height:2px;background:var(--sl);opacity:.35;margin:0 0 14px;border-radius:2px}
#read article{border-left:2px solid var(--sl);padding:2px 0 2px 14px;margin:0 0 22px}
#read article.hit{background:var(--brand-soft);border-radius:0 6px 6px 0}
#read .eh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
#read .eh code{font:600 12.5px var(--mono);color:var(--ink)}
#read .eh .ttl{font:600 14.5px var(--sans);color:var(--ink)}
#read .meta{color:var(--dim);font-size:11.5px;margin:3px 0 7px;
  display:flex;gap:14px;flex-wrap:wrap}
#read .meta b{color:var(--ink-soft);font-weight:500;font-family:var(--mono);font-size:11px}
#read .bd{white-space:pre-wrap;font:13px/1.62 var(--sans);color:var(--ink-soft);
  margin:0 0 6px}
#read .cmt{border-left:2px solid var(--warn);background:var(--warn-bg);border-radius:0 5px 5px 0;
  padding:6px 9px;margin:8px 0 0;font-size:12px;color:var(--ink-soft)}
#read .cmt b{color:var(--warn);display:block;font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:2px}
#read .none{color:var(--dim);font-size:12.5px;font-style:italic;margin:0 0 20px}

/* the outline replaces the inspector while reading */
#toc{font-size:12.5px}
#toc .lay{font:600 10px var(--sans);letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);margin:16px 0 5px}
#toc .lay:first-child{margin-top:0}
#toc .sl{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-weight:600;
  margin:8px 0 3px;cursor:pointer;font-size:12px}
#toc .sl i{width:8px;height:8px;border-radius:2px;background:var(--sl);flex:none}
#toc .sl:hover{color:var(--brand)}
#toc a{display:block;color:var(--ink-soft);text-decoration:none;padding:1.5px 0 1.5px 15px;
  border-left:1px solid var(--rule-soft);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
#toc a:hover{color:var(--brand);border-left-color:var(--brand)}
#toc a.here{color:var(--brand);border-left-color:var(--brand);font-weight:600}
#toc a code{font-family:var(--mono);font-size:11px;opacity:.75;margin-right:5px}
#readbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#readbar input[type=search]{background:var(--panel-alt);color:var(--ink);
  border:1px solid var(--rule);border-radius:6px;padding:3px 8px;font:inherit;width:190px}

/* ── slice grouping + the order view ────────────────────────────── */
.sliceband{fill:var(--sl);opacity:.055}
.sliceband.alt{opacity:.1}
.slicetag{font:600 9.5px var(--mono);fill:var(--sl);letter-spacing:.04em}
.lanerule{stroke:var(--rule-soft);stroke-width:1;stroke-dasharray:2 4}
.stephead{font:600 10px var(--sans);letter-spacing:.09em;text-transform:uppercase;fill:var(--dim)}
.lanelabel{font:600 12px var(--sans);fill:var(--sl)}
.lanemeta{font:10.5px var(--sans);fill:var(--dim)}
/* In the order view depends_on IS the subject, so it is drawn rather than
   hinted at. A dependency inside one lane is ordinary sequencing; one that
   crosses a lane is a slice waiting on a slice, which is the fact worth
   seeing -- and the only reason the slice graph and the waves exist. */
.edge.ord{stroke:var(--ink-soft);stroke-opacity:.35;stroke-width:1.2}
.edge.ord.x{stroke:var(--warn);stroke-opacity:.75;stroke-width:1.6;marker-end:url(#a-h)}
.edge.ord.lit{stroke:var(--brand);stroke-opacity:1;stroke-width:2.2}
.viewbar{position:absolute;left:14px;top:12px;z-index:2;display:flex;gap:8px;align-items:center;
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);

.viewbar select{background:var(--panel-alt);color:var(--ink);border:1px solid var(--rule);
  border-radius:6px;padding:2px 6px;font:inherit}
.viewbar label{display:flex;gap:6px;align-items:center;color:var(--ink-soft);cursor:pointer}
.viewbar .sep{width:1px;height:16px;background:var(--rule)}
.viewbar .muted{font-size:11.5px}

/* ── a decision waiting on a human ──────────────────────────────── */
#pending{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;
  background:var(--brand-soft);border-bottom:1px solid var(--rule);font-size:13px}
#pending[hidden]{display:none}

#pending button{margin-left:auto;background:var(--brand);color:var(--brand-ink);border:0;
  border-radius:var(--radius);padding:4px 12px;font:inherit;font-weight:600;cursor:pointer}

  font-size:12px;font-weight:600}
#previewflag[hidden]{display:none}
/* The rail dot: Queues holds three things now, and only one of them can
   need you. Without a mark, a pending decision is invisible from the view
   you are actually on. */
nav button.view .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--brand);margin-left:6px;vertical-align:middle}

/* Queues is three sections now. The two queues are tables; the decision is
   not a table, and must not read as one. */
.qsec{margin-bottom:30px}
.qsec > h3{display:flex;align-items:baseline;gap:8px}
.qsec > h3 .n{color:var(--ink);font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.decide{border:1px solid var(--brand);border-radius:var(--radius);background:var(--panel);
  padding:14px 16px;box-shadow:var(--shadow)}

.decide .lede{color:var(--ink-soft);font-size:13px;margin:0 0 14px;max-width:78ch}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

  padding:8px 11px;min-width:150px;background:var(--panel-alt)}

  padding:8px 11px;background:var(--panel-alt);border-radius:var(--radius);font-size:12.5px}
.verdict b{font-variant-numeric:tabular-nums}
.note{white-space:pre-wrap;background:var(--panel-alt);border-radius:var(--radius);
  padding:10px 12px;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;
  max-height:30vh;overflow:auto}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--panel);color:var(--ink);font:inherit;
  border-radius:var(--radius);padding:6px 14px;cursor:pointer}
.btn.go{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}

.btn:disabled{opacity:.5;cursor:not-allowed}
.acts .spacer{margin-left:auto;color:var(--dim);font-size:12px}
/* What pressing actually means. Stated before the controls, not after --
   a reader must know what a button is worth before forming the intention
   to press it. */
.inert{background:var(--panel-alt);color:var(--ink-soft);border-radius:var(--radius);
  padding:10px 12px;font-size:12.5px;margin:0 0 14px;max-width:80ch}

/* Outlives the reload a decision triggers. Held in STATE, not in the DOM:

   old markup is destroyed by the very success it is reporting. */
.flash{border-radius:var(--radius);padding:10px 12px;font-size:12.5px;margin-bottom:22px;

  border:1px solid var(--rule);border-radius:var(--radius);padding:8px 10px;font:inherit;
  font-size:12.5px;resize:vertical}

<script>
"use strict";
/* =============================================================
   DATA

   Every fetch is RELATIVE and does not begin with a slash. Served
   at /dashboard on this unit, a relative path lands at the unit's
   own root; served at /dashboard/mu-spec/ through the node's read
   proxy, the same string lands inside the proxied prefix. One
   file, both contexts, no conditional. An absolute path would
   reach the NODE, which answers with plausible JSON of the wrong
   shape rather than an error.
   ============================================================= */
const enc = encodeURIComponent;

async function get(path){
  const r = await fetch(path, {headers:{accept:"application/json"}});
  if(!r.ok) throw new Error(path + " → " + r.status);
  return r.json();
}
/* An optional read degrades to a default. Absence is normal here:
   a project with no issues, no modules and no insights yet is a
   new project, not a broken one. */
const soft = (path, fallback) => get(path).catch(() => fallback);

/* Six columns, two BANDS.

   Tests fork off spec rather than continuing under it, so they do not
   belong on the same row as the corpus: a T column sitting between Spec
   and Modules at the same height would draw a chain that does not exist.
   They get a column position of their own -- x between spec and modules --
   and a band of their own below everything else.

   The upper band is the corpus: I B A S, and the implementation files at M.
   The lower band is verification: a GHOST of each tested spec entry at the
   same x as the real one, the scenarios at T, and the test files at M. The
   ghost is what lets the spec-to-test edge draw as one short vertical hop
   inside the band instead of a long arc crossing the whole picture and
   every edge in it. */
const LAYERS=[["I","Intent"],["B","Behaviour"],["A","Architecture"],["S","Spec"],
              ["T","Tests"],["M","Modules"]];
const LIX = Object.fromEntries(LAYERS.map((l,i)=>[l[0],i]));
const MODULE_LAYER = LIX.M;
const TEST_LAYER = LIX.T;
const CORPUS=0, VERIFY=1;
const GHOST = id => "⧉" + id;      // the copy's id; never an entry
const isGhost = id => typeof id === "string" && id[0] === "⧉";
const realOf = id => isGhost(id) ? id.slice(1) : id;

/* Slice names are data, so colours are assigned by position in the
   sorted name list rather than written down anywhere. */
const PALETTE = ["#2f6f6b","#7a5cc4","#9a6b12","#2e7d4f","#a13a2c",
                 "#3a6ea5","#9c4f7c","#6b7a2f","#a5622c","#4a4f8c"];
const UNSLICED = "#8a877f";

const STATE = {
  project:null, projects:[], entries:[], byId:{},
  slices:{},          // name -> {type, hue, wave, deps, size, cohesion}
  waves:[], gates:null, issues:[], requests:[], modules:[],
  unimplemented:[], unimplementedTests:[], untested:[],
  units:null,        // the stored cut, its drift, and the live projection
  locality:null, bodies:{}, live:false,
  proposal:null,        // the pending slicing decision, if any
  flash:null,           // the outcome of the last decision, see decide()
  /* Uncommitted input. Rule 4: a refresh may not overwrite what the reader
     is part-way through writing, and may not stop the world to avoid it --
     so the draft lives here and the textarea is rendered from it. Cleared
     only when submitted or explicitly cancelled, never on blur: clicking
     away to re-read the proposal is not abandoning the note. */
  rejectDraft:{open:false, note:""},
  preview:false         // spine recoloured by the proposal rather than the manifest
};

async function loadProjects(){
  const d = await get("projects");
  return Array.isArray(d.projects) ? d.projects : [];
}

/* Returns a plain object and writes nothing. Rule 1 needs to compare the
   new payload with the last one, which is impossible if fetching has
   already overwritten it. */
async function fetchProject(project){
  const base = "projects/" + enc(project);
  const [spine, gates, waves, insights, issues, inbox, modules, proposal, units] =
    await Promise.all([
    get(base + "/spine"),                               // the only hard requirement
    soft(base + "/gates", null),
    soft(base + "/waves", {waves:[], wave_of:{}}),
    soft(base + "/insights", {slices:[], change_locality:{}}),
    soft(base + "/issues", {issues:[]}),
    soft("inbox?project=" + enc(project), {messages:[]}),
    soft(base + "/modules", {modules:[]}),
    soft(base + "/slicing/proposal", {status:"none"}),
    soft(base + "/units", {cut:null, drift:null, live:null})
  ]);

  const entries = (spine.spine || []).map(e => ({
    id: e.id,
    title: e.title || "",
    layer: LIX[e.id[0]],
    band: e.id[0] === "T" ? VERIFY : CORPUS,
    test: e.id[0] === "T",
    slice: e.slice || "unsliced",
    derives: e.derives_from || [],
    deps: e.depends_on || [],
    emits: e.emits_into || []
  })).filter(e => e.layer !== undefined);

  /* A module is not an entry in the graph -- code never is -- but its
     declared backlink is the only thing tying a file to the reasoning
     that produced it, so it is drawn as the bottom column and takes
     the slice colour of what it implements. */
  const byId = Object.fromEntries(entries.map(e=>[e.id,e]));

  /* A scenario has no slice and never will -- its column is the column of
     the spec entry it judges, resolved here rather than stored. Writing it
     down would be a second copy of a fact the graph already holds, and the
     copy is what goes stale the first time a slice splits. */
  for(const e of entries)
    if(e.test) e.slice = (byId[e.derives[0]] || {}).slice || "unsliced";

  for(const m of (modules.modules || [])){
    const impl = m.implements || [];
    const test = impl.length > 0 && impl[0][0] === "T";
    entries.push({
      id: m.path, title: m.path, layer: MODULE_LAYER, module: true,
      test, band: test ? VERIFY : CORPUS,
      slice: (byId[impl[0]] || {}).slice || "unsliced",
      derives: impl, deps: [], emits: []
    });
  }

  const names = [...new Set(entries.map(e=>e.slice))].filter(s=>s!=="unsliced").sort();
  const info = Object.fromEntries((insights.slices||[]).map(s=>[s.slice,s]));
  const slices = {};
  names.forEach((n,i)=>{
    const s = info[n] || {};
    slices[n] = {
      type: s.type || "slice",
      hue: PALETTE[i % PALETTE.length],
      wave: (waves.wave_of || {})[n],
      deps: s.depends_on || [],
      size: entries.filter(e=>e.slice===n).length,
      cohesion: s.cohesion
    };
  });

  return {
    project, entries, byId: Object.fromEntries(entries.map(e=>[e.id,e])),
    slices, waves: waves.waves || [], gates,
    issues: issues.issues || [],
    requests: (inbox.messages || []).slice().sort((a,b)=>(b.at||0)-(a.at||0)),
    modules: modules.modules || [],
    /* Three reports that are easy to conflate and have different
       remedies: a contract nobody built, a scenario nobody built, and a
       contract nobody said how to falsify. */
    unimplemented: modules.unimplemented || [],
    unimplementedTests: modules.unimplemented_tests || [],
    untested: modules.untested || [],
    locality: (insights.change_locality || {}).mean,
    proposal: proposal && proposal.status === "pending" ? proposal : null,
    units
  };
}

/* What a poll compares. Deliberately NOT the whole payload: `hue` is
   assigned by position in the sorted slice list, so it is derived here
   rather than received, and comparing it would be comparing this page's
   own output with itself. Everything in here is something the unit said. */
function signatures(d){
  const J = x => JSON.stringify(x);
  return {
    graph: J(d.entries.map(e=>[e.id,e.title,e.slice,e.derives,e.deps,e.emits])),
    slices: J(Object.entries(d.slices).map(([n,s])=>[n,s.type,s.wave,s.deps,s.size,s.cohesion])),
    waves: J(d.waves),
    gates: J(d.gates),
    strip: J([d.locality, (d.gates||{}).sound, (d.gates||{}).complete]),
    proposal: J(d.proposal),
    modules: J(d.modules),
    units: J(d.units),
    queues: J([d.issues, d.requests])
  };
}

function applyProject(d){
  // A cut outcome belongs to the project it was attempted on. Carrying it
  // across a project switch reports a refusal about one project while
  // showing another -- which is how a reader concludes the wrong thing is
  // broken. Cleared here rather than in the switch handler so a poll, which
  // also lands here, cannot resurrect it either.
  if(STATE.project !== d.project) STATE.cutFlash = null;
  Object.assign(STATE, d, {bodies: STATE.bodies || {}, preview: false});
  /* Which slice each entry WOULD belong to if the proposal were ratified.
     Held beside the real membership rather than replacing it -- previewing a
     decision must never look like having taken it. */
  if(STATE.proposal){
    const map = {};
    for(const [name, ids] of Object.entries(STATE.proposal.proposal || {}))
      for(const id of ids) map[id] = name;
    for(const e of STATE.entries){ e.trueSlice = e.slice; e.propSlice = map[e.id] || "unsliced"; }
  }
}

const hueOf = s => s==="unsliced" ? UNSLICED : (STATE.slices[s]||{}).hue || UNSLICED;
const isXC  = s => (STATE.slices[s]||{}).type === "cross_cutting";

/* -- verification ------------------------------------------------------
   Every one of these is a graph query, not a stored flag. A test that has
   been written but not yet built is the case worth being careful about:
   it is NOT a failure and must not read as one. It orders nothing, and it
   is not yet expected to pass. */
const testsOf   = id => STATE.entries.filter(e => e.test && !e.module
                                              && e.derives.includes(id));
const modulesOf = id => STATE.entries.filter(e => e.module && e.derives.includes(id));
const hasTests  = () => STATE.entries.some(e => e.test && !e.module);
/* Only meaningful once testing has started. Before the first scenario
   exists every contract is untested, and badging all of them says nothing
   except that the project has not got there yet -- which the header
   already says once, in a number. */
const isUntested = id => hasTests() && STATE.untested.includes(id);
const isUnbuilt  = e  => e.test && !e.module && !modulesOf(e.id).length;

/* -- work units --------------------------------------------------------
   The stored cut when there is one, the live projection otherwise. Both
   come from the unit; this page projects nothing, because two statements
   of the same fact drift. */
/* The LIVE projection, not the stored cut -- and the two answer different
   questions, which is why this differs from the Waves view one deliberately.

   Found by driving the page: t-finance had a cut taken before any scenario
   existed, so the spine showed an entry whose Verification panel said "the
   unit building this follows the unit holding those files" directly above a
   Work unit panel saying "waits on nothing". Both were reading truthfully;
   they were reading different projections.

   The spine answers "what would I build now", so it takes the live graph --
   the same choice `get_work_unit` makes, and for the same reason. Waves
   answers "what was handed out", so it keeps the cut and reports drift. */
function unitSource(){
  const u = STATE.units;
  return (u && u.live) || (u && u.cut) || null;
}
/* id -> unit key, for entries AND module paths. A unit is entries and the
   files implementing them, so both kinds of node belong to one. */
function unitIndex(){
  const src = unitSource(), map = {};
  for(const u of ((src && src.units) || [])){
    for(const id of (u.entries || [])) map[id] = u.key;
    for(const m of (u.modules || [])) map[m] = u.key;
  }
  return map;
}
const unitOf = id => UNITX[realOf(id)];
let UNITX = {};

const kids   = id => STATE.entries.filter(e=>e.derives.includes(id));
const downTo = id => {const s=new Set();(function w(x){for(const k of kids(x))
  if(!s.has(k.id)){s.add(k.id);w(k.id)}})(id);return s};
const upFrom = id => {const s=new Set();(function u(x){const n=STATE.byId[x];if(!n)return;
  for(const p of n.derives) if(!s.has(p)){s.add(p);u(p)}})(id);return s};
const sideOf = id => {
  const need=new Set(), served=new Set();
  (function u(x){const n=STATE.byId[x];if(!n)return;
    for(const d of n.deps) if(!need.has(d)){need.add(d);u(d)}})(id);
  (function d(x){for(const e of STATE.entries)
    if(e.deps.includes(x)&&!served.has(e.id)){served.add(e.id);d(e.id)}})(id);
  return {need,served};
};

/* =============================================================
   LAYOUT — the layered pipeline, adapted from pu's.

   One structural difference: a layer here is NOT computed by
   longest path. It is fixed by the identifier prefix, because
   derives_from runs exactly one layer up by construction. That
   removes the cycle-breaking and dummy-node steps entirely --
   no vertical edge can ever span more than one column.

   What remains is ordering within a column so the edges between
   columns stop crossing, and coordinate assignment that
   guarantees separation.
   ============================================================= */
const NODE_W=212, NODE_H=46, NODE_GAP=26, LAYER_GAP=392, SWEEPS=14;
const GROUP_GAP=44;                                // between slice groups in a column
/* Between the corpus and the verification band. Deliberately large: the
   two are not one picture with a gap, they are two rows, and a reader has
   to see that a scenario is not the next link in the chain. */
const BAND_GAP=200;
const STEP_GAP=300, LANE_PAD=30, LANE_LABEL=190;   // the order view
/* Always. See the viewbar comment: ungrouped was a second reading of the
   same picture that nobody chose deliberately. */
const GROUPED=true;
/* How the verification layer is drawn. "band" puts scenarios in a row of
   their own below the corpus, with a copy of each judged spec entry beside
   them. "inline" puts them in the Tests column at corpus level, beside the
   contract they judge. The two trade against each other and neither wins
   outright, which is why both exist -- see LAYOUT MODES below. */
let LAYOUT="band";
const COL_X = i => i*LAYER_GAP;

/* Adjacency over ONE band's own vertical edges. The bands are laid out
   separately -- crossing reduction inside the verification band must not
   be pulled around by the corpus above it, and vice versa -- so the
   relation is built from the node set being laid out, never from all of
   STATE. */
/* Every node currently being laid out, ghosts included. STATE.byId holds
   only real entries, so anything reading a ghost's slice through it gets
   "unsliced" -- which silently dropped the copies out of slice grouping. */
let NODEX = {};
const nodeOf = id => NODEX[id] || STATE.byId[id] || {};

function adjacency(nodes){
  const adj=new Map(), have=new Set(nodes.map(n=>n.id)), link=(a,b)=>{
    if(!adj.has(a))adj.set(a,[]); adj.get(a).push(b);
    if(!adj.has(b))adj.set(b,[]); adj.get(b).push(a);};
  for(const e of nodes) for(const p of e.derives) if(have.has(p)) link(p,e.id);
  return adj;
}

function countCrossings(order,adj){
  let total=0;
  for(let i=0;i<order.length-1;i++){
    const up=new Map(order[i].map((id,n)=>[id,n]));
    const lo=new Map(order[i+1].map((id,n)=>[id,n]));
    const pairs=[];
    for(const id of order[i]) for(const o of adj.get(id)||[])
      if(lo.has(o)) pairs.push([up.get(id),lo.get(o)]);
    for(let a=0;a<pairs.length;a++) for(let b=a+1;b<pairs.length;b++)
      if((pairs[a][0]-pairs[b][0])*(pairs[a][1]-pairs[b][1])<0) total++;
  }
  return total;
}

/* Median heuristic (Eades & Wells): a node wants the median slot of
   its neighbours in the adjacent column. Median beats barycentre on
   uneven degree, and a derivation graph always has uneven degree --
   one intent with nine behaviours under it is the normal case.
   Every sweep is scored and only an improvement is kept.
   ponytail: O(e^2) crossing count per layer pair. Instant at a few
   hundred entries; past that, cap the drawn graph rather than
   optimising this -- a thousand-node picture does not read anyway. */
function reduceCrossings(byLayer,adj){
  let best=byLayer.map(l=>[...l]), bestScore=countCrossings(best,adj);
  let cur=best.map(l=>[...l]);
  for(let s=0;s<SWEEPS&&bestScore>0;s++){
    const down=s%2===0;
    const range=down?[...cur.keys()].slice(1):[...cur.keys()].slice(0,-1).reverse();
    for(const i of range){
      const fixed=cur[down?i-1:i+1], pos=new Map(fixed.map((id,n)=>[id,n]));
      const key=new Map();
      for(const id of cur[i]){
        const ns=(adj.get(id)||[]).map(o=>pos.get(o)).filter(p=>p!==undefined).sort((a,b)=>a-b);
        if(!ns.length){key.set(id,Infinity);continue}
        const m=Math.floor(ns.length/2);
        key.set(id, ns.length%2?ns[m]:(ns[m-1]+ns[m])/2);
      }
      let prev=0;                        // a node with no neighbour keeps its place
      for(const id of cur[i]){ if(key.get(id)===Infinity) key.set(id,prev); else prev=key.get(id); }
      cur[i]=[...cur[i]].sort((a,b)=>key.get(a)-key.get(b));
    }
    const sc=countCrossings(cur,adj);
    if(sc<bestScore){bestScore=sc;best=cur.map(l=>[...l])}
  }
  return {order:best,crossings:bestScore};
}

/* Align to the mean of neighbours so long derivation chains draw
   straight, then a hard separation pass. Separation runs LAST on
   purpose: whatever the alignment wanted, nothing is allowed to
   end up on top of anything else. */
function assignY(order,adj){
  const y=new Map();
  for(const col of order){ let c=0; for(const id of col){ y.set(id,c+NODE_H/2); c+=NODE_H+NODE_GAP; } }
  const separate=col=>{
    const s=[...col].sort((a,b)=>y.get(a)-y.get(b));
    for(let i=1;i<s.length;i++){
      const floor=y.get(s[i-1])+NODE_H+NODE_GAP;
      if(y.get(s[i])<floor) y.set(s[i],floor);
    }
  };
  for(let pass=0;pass<5;pass++){
    const cols=pass%2===0?order:[...order].reverse();
    for(const col of cols){
      for(const id of col){
        const ns=(adj.get(id)||[]).map(o=>y.get(o)).filter(v=>v!==undefined);
        if(ns.length) y.set(id, ns.reduce((a,b)=>a+b,0)/ns.length);
      }
      separate(col);
    }
  }
  const vals=[...y.values()];
  if(!vals.length) return y;
  const top=Math.min(...vals);
  for(const [id,v] of y) y.set(id,v-top);
  return y;
}

/* Same-layer edges share one gutter per column, so they need lanes
   or they draw on top of each other. Greedy interval packing: an
   edge takes the innermost lane whose occupied spans it does not
   overlap. Short hops stay close to the column, long ones bow out. */
function laneFor(edges){
  const lanes=[];
  for(const e of [...edges].sort((a,b)=>(a.hi-a.lo)-(b.hi-b.lo))){
    let n=0;
    while(lanes[n]&&lanes[n].some(s=>!(e.hi<s.lo-4||e.lo>s.hi+4))) n++;
    (lanes[n]=lanes[n]||[]).push(e); e.lane=n;
  }
}

/* Slices ranked for display: by the wave the unit computed, then by name,
   with unsliced last. Two slices in one wave have no edge between them, so
   any order within a wave is as good as any other -- name keeps it stable
   across reloads, which matters more than which of them comes first. */
function sliceRank(){
  const names=Object.keys(STATE.slices);
  const rank=Object.fromEntries(names
    .sort((a,b)=>{
      const wa=STATE.slices[a].wave, wb=STATE.slices[b].wave;
      if(wa!==wb) return (wa==null?99:wa)-(wb==null?99:wb);
      return a<b?-1:1;})
    .map((n,i)=>[n,i]));
  rank.unsliced=names.length+1;
  return rank;
}

/* Grouped layout: slice members sit together in a column instead of being
   scattered wherever crossing-reduction put them.

   The intra-group order is still the crossing-minimised one -- grouping
   constrains where a block goes, not what happens inside it -- so this
   costs crossings rather than discarding the optimisation. The count stays
   on screen either way, because the trade is the reader's to make: grouped
   reads better by subject, ungrouped reads better by derivation.

   Columns are then centred on a shared midline rather than hung from the
   top. Layers are wildly uneven -- nine intents against thirty-four
   architecture entries -- and top-alignment puts the short column opposite
   the start of the long one, so every edge out of it rakes downward and
   the picture reads as lopsided rather than as layered. */
function assignYGrouped(order,adj){
  /* One ROW per slice, shared by every column -- so `capture` in Spec sits
     opposite `capture` in Architecture and opposite `capture` in Tests, and
     the picture reads as a grid: layers across, slices down.

     This replaces centring each column on a shared midline. That fixed the
     right problem (layers are wildly uneven -- nine intents against
     thirty-four architecture entries, so top-alignment rakes every edge
     downward) but fixed it per column, which misaligns the slices. The
     Tests column showed it plainly: one small `capture` group, centred, ended
     up floating opposite `observability` three columns to its left, next to
     entries it has nothing to do with.

     Rows are sized by the FULLEST column, and a shorter column's members are
     centred inside the row. So a slice reads as one horizontal strip whatever
     the counts are. */
  const rank=sliceRank(), y=new Map(), bands=[];

  const perCol=[];
  const heights=new Map();                 // slice -> tallest member count
  for(let col=0;col<order.length;col++){
    const groups=new Map();
    for(const id of order[col]){           // preserves the optimised order
      const s=nodeOf(id).slice||"unsliced";
      (groups.get(s)||groups.set(s,[]).get(s)).push(id);
    }
    perCol.push(groups);
    for(const [name,members] of groups)
      heights.set(name, Math.max(heights.get(name)||0, members.length));
  }
  if(!heights.size) return {y,bands};

  const names=[...heights.keys()].sort((a,b)=>(rank[a]??99)-(rank[b]??99));
  const span=n=>n*NODE_H+(n-1)*NODE_GAP;   // height of n stacked nodes

  const top=new Map();
  let cursor=0;
  for(const name of names){
    top.set(name,cursor);
    cursor+=span(heights.get(name))+GROUP_GAP;
  }
  const total=Math.max(0,cursor-GROUP_GAP);

  for(let col=0;col<perCol.length;col++){
    /* Intent is never sliced -- short by nature, everyone reads all of it --
       so a column of nothing but unsliced entries has no row to belong to.
       Filing it under the `unsliced` row banished intent to the bottom of
       the picture while every entry deriving from it sat in a slice row
       above, and every edge out of it raked upward across the whole graph.
       Centred over the full height instead, which is where its fan-out
       reads from. The same rule covers behaviour before slicing is
       ratified, for the same reason: it has no owner yet. */
    const members=[...perCol[col].values()].flat();
    const bare=members.length
      && members.every(id=>(nodeOf(id).slice||"unsliced")==="unsliced");
    if(bare){
      const off=(total-span(members.length))/2;
      members.forEach((id,n)=>y.set(id,off+n*(NODE_H+NODE_GAP)+NODE_H/2));
      continue;                       // no band: unsliced names no slice
    }
    for(const [name,group] of perCol[col]){
      const rowTop=top.get(name);
      // centred inside the row, so a column holding two of a six-member
      // slice sits opposite the middle of it rather than at its head
      const off=rowTop+(span(heights.get(name))-span(group.length))/2;
      group.forEach((id,n)=>y.set(id,off+n*(NODE_H+NODE_GAP)+NODE_H/2));
      bands.push({col,slice:name,top:off-10,height:span(group.length)+20});
    }
  }
  return {y,bands};
}

function verifyNodes(){
  const tests = STATE.entries.filter(e => e.test && !e.module);
  if(!tests.length) return [];
  const judged = [...new Set(tests.flatMap(t => t.derives))]
    .filter(id => (STATE.byId[id] || {}).layer === LIX.S);
  const ghosts = judged.map(id => ({
    id: GHOST(id), ghost: true, real: id, layer: LIX.S, band: VERIFY,
    title: (STATE.byId[id] || {}).title || "",
    slice: (STATE.byId[id] || {}).slice || "unsliced",
    derives: [], deps: [], emits: []
  }));
  /* The scenarios point at the GHOST for layout, never at the real entry:
     an edge to the corpus would drag this band's y-assignment up into it. */
  const rewired = tests.map(t => ({...t, derives: t.derives.map(GHOST)}));
  const files = STATE.entries.filter(e => e.module && e.test);
  return [...ghosts, ...rewired, ...files];
}

/* One band, laid out on its own. Columns keep their real index so COL_X
   stays the single source of x for both bands -- an empty column is just
   an empty array, which every step below already handles. */
function layoutBand(nodes){
  const order0 = LAYERS.map((L,i)=>nodes.filter(e=>e.layer===i).map(e=>e.id));
  const adj = adjacency(nodes);
  const {order,crossings} = reduceCrossings(order0,adj);
  const grouped = GROUPED ? assignYGrouped(order,adj) : null;
  const y = grouped ? grouped.y : assignY(order,adj);
  const ys = [...y.values()];
  return {order, y, adj, crossings, bands: grouped ? grouped.bands : [],
          height: ys.length ? Math.max(...ys)+NODE_H : 0};
}

/* =============================================================
   LAYOUT MODES

   Two ways to draw the same fork, and they trade against each other
   rather than one being right.

   BAND puts scenarios in a row below the corpus, with a copy of each
   judged spec entry beside them. The verification layer reads as one
   picture you can take in whole. The costs are real: every judged
   contract appears twice, and the chain from a scenario back to intent
   is not on screen -- the copy is a jump to somewhere far away.

   INLINE puts scenarios in the Tests column at corpus level, beside the
   contract they judge. Nothing is duplicated and the whole derivation
   reads straight across: intent, behaviour, architecture, spec,
   scenario. The cost is that the verification layer stops being one
   thing you can look at -- it is scattered down the length of the
   corpus, and a project with few scenarios has a mostly empty column
   running its whole height.

   Neither is a compromise of the other, so both are kept and the reader
   picks. Nothing about the DATA changes between them; this is a drawing
   decision and the graph is identical underneath.
   ============================================================= */
function buildScene(){
  const inline = LAYOUT === "inline";
  const corpus = inline ? STATE.entries : STATE.entries.filter(e => e.band !== VERIFY);
  const verify = inline ? [] : verifyNodes();
  NODEX = {};
  for(const e of [...corpus, ...verify]) NODEX[e.id] = e;
  const A = layoutBand(corpus);
  const B = verify.length ? layoutBand(verify) : null;
  const bandTop = A.height + BAND_GAP;

  const pos = new Map(), node = new Map();
  for(const e of corpus) node.set(e.id, e);
  A.order.forEach((col,i)=>col.forEach(id=>
    pos.set(id,{x:COL_X(i), y:A.y.get(id), col:i, band:CORPUS})));
  const bands = A.bands.map(b=>({...b, band:CORPUS}));

  if(B){
    for(const e of verify) node.set(e.id, e);
    B.order.forEach((col,i)=>col.forEach(id=>
      pos.set(id,{x:COL_X(i), y:B.y.get(id)+bandTop, col:i, band:VERIFY})));
    for(const b of B.bands) bands.push({...b, top:b.top+bandTop, band:VERIFY});
  }

  /* Vertical edges are resolved inside a band. The only edge that would
     cross one is spec-to-test, and the ghost is exactly what stands in for
     it -- so there is no cross-band line to draw, by construction. */
  const vEdges=[];
  for(const e of [...corpus, ...verify]) for(const p of e.derives)
    if(pos.has(p)&&pos.has(e.id)) vEdges.push({kind:"v",from:p,to:e.id});

  /* A scenario carries no horizontal edge of either kind -- that is what
     makes a unit holding test files a root -- so this loop finds none in
     the verification band, and nothing here has to exclude them. */
  const hEdges=[];
  for(const e of corpus){
    for(const d of e.deps)  if(pos.has(d)&&pos.has(e.id)) hEdges.push({kind:"h",from:d,to:e.id});
    for(const m of e.emits) if(pos.has(m)&&pos.has(e.id)) hEdges.push({kind:"e",from:e.id,to:m});
  }
  const byCol={};
  for(const h of hEdges){
    const a=pos.get(h.from),b=pos.get(h.to);
    h.lo=Math.min(a.y,b.y); h.hi=Math.max(a.y,b.y); h.col=a.col;
    (byCol[a.col]=byCol[a.col]||[]).push(h);
  }
  for(const c in byCol) laneFor(byCol[c]);

  const ys=[...pos.values()].map(p=>p.y);
  return {pos, node, order:A.order, vEdges, hEdges, bands,
          crossings:A.crossings + (B?B.crossings:0),
          verify: !!B, bandTop,
          width:COL_X(LAYERS.length-1)+NODE_W,
          height:ys.length?Math.max(...ys)+NODE_H:0};
}

/* A vertical edge leaves the right edge of its parent and arrives at
   the left edge of its child. */
function vPath(a,b){
  const x1=a.x+NODE_W, y1=a.y, x2=b.x, y2=b.y, mid=(x1+x2)/2;
  return `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
}
/* A same-layer edge bows out to the left of its own column, in its
   assigned lane, and re-enters the left edge of the target. */
function hPath(a,b,lane){
  const gx=a.x-30-lane*17;
  return `M ${a.x} ${a.y} C ${gx} ${a.y}, ${gx} ${b.y}, ${b.x} ${b.y}`;
}

/* =============================================================
   RENDER
   ============================================================= */
const $=id=>document.getElementById(id);
const svgEl=(t,at)=>{const n=document.createElementNS("http://www.w3.org/2000/svg",t);
  for(const k in at) n.setAttribute(k,at[k]); return n};
const clip=(s,n)=>(s||"").length>n?(s||"").slice(0,n-1)+"…":(s||"");
/* Bodies, titles and claims were written by whoever could reach this
   unit. They are shown as text, never parsed as markup -- the same
   rule the standard states for a `text` panel source. */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short=p=>{const b=String(p).split(/[\\/]/).pop();return b||String(p)};

let SCENE=null, sel=null, focusSlice=null;
let view={x:40,y:30,k:1};
let MODE="spine", ORDER_LAYER=1;    // Behaviour: the first layer that has depends_on
let RD_LAYER="*", RD_FIND="";       // the read view: all layers, no filter

function drawSpine(){
  UNITX=unitIndex();
  SCENE=buildScene();
  const g=$("scene"); g.innerHTML="";

  $("empty").classList.toggle("hide", STATE.entries.length>0);
  if(!STATE.entries.length){
    $("empty").textContent = STATE.project
      ? "No entries in " + STATE.project + " yet. The graph appears once an amendment lands."
      : "No projects yet.";
    $("k-xing").textContent="0";
    $("n-h").textContent="0"; $("n-e").textContent="0";
    return;
  }

  // Only columns that hold something, headed once per band. An empty
  // column labelled anyway reads as "nothing here yet" occupying a sixth
  // of the width -- and the Tests column is empty in the corpus by
  // definition, so this is what keeps the upper band four columns wide
  // until scenarios exist.
  const head=(i,label,top)=>{
    const t=svgEl("text",{class:"colhead",x:COL_X(i),y:top-26}); t.textContent=label;
    g.appendChild(t);
    g.appendChild(svgEl("line",{class:"colrule",
      x1:COL_X(i),y1:top-18,x2:COL_X(i)+NODE_W,y2:top-18}));
  };
  const inBand=(i,band)=>[...SCENE.pos].some(([id,q])=>q.col===i&&q.band===band);
  LAYERS.forEach((L,i)=>{ if(inBand(i,CORPUS)) head(i,L[1],0); });

  if(SCENE.verify){
    const top = SCENE.bandTop;
    /* The band is a second ROW, not a continuation of the columns above.
       A rule across the full width says so before any label does. */
    const left=COL_X(LIX.S)-40;
    g.appendChild(svgEl("line",{class:"bandrule",
      x1:left, y1:top-70, x2:SCENE.width+40, y2:top-70}));
    const cap=svgEl("text",{class:"bandcap",x:left,y:top-80});
    cap.textContent="VERIFICATION — how these contracts can be caught failing";
    g.appendChild(cap);
    const NAMES={[LIX.S]:"Spec (the entries judged)",[LIX.T]:"Tests",
                 [MODULE_LAYER]:"Test files"};
    LAYERS.forEach((L,i)=>{ if(inBand(i,VERIFY)) head(i,NAMES[i]||L[1],top); });
  }

  // Bands first, so every edge and node draws over them.
  (SCENE.bands||[]).forEach((b,i)=>{
    g.appendChild(svgEl("rect",{class:"sliceband"+(i%2?" alt":""),
      x:COL_X(b.col)-10, y:b.top, width:NODE_W+20, height:b.height, rx:6,
      style:`--sl:${hueOf(b.slice)}`}));
    if(b.slice!=="unsliced"){
      const t=svgEl("text",{class:"slicetag",x:COL_X(b.col)-8,y:b.top-4,
        style:`--sl:${hueOf(b.slice)}`});
      t.textContent=b.slice.toUpperCase();
      g.appendChild(t);
    }
  });

  for(const e of SCENE.vEdges){
    const a=SCENE.pos.get(e.from),b=SCENE.pos.get(e.to);
    g.appendChild(svgEl("path",{class:"edge",d:vPath(a,b),
      "data-from":e.from,"data-to":e.to,"data-kind":"v"}));
  }
  for(const e of SCENE.hEdges){
    const a=SCENE.pos.get(e.from),b=SCENE.pos.get(e.to);
    g.appendChild(svgEl("path",{class:"edge "+e.kind,d:hPath(a,b,e.lane),
      "data-from":e.from,"data-to":e.to,"data-kind":e.kind}));
  }

  for(const [id,p] of SCENE.pos){
    const e=SCENE.node.get(id), hue=hueOf(e.slice);
    const cls=["node"];
    if(e.module) cls.push("mod");
    if(e.ghost) cls.push("ghost");
    if(e.test) cls.push("tst");
    if(isUnbuilt(e)) cls.push("unbuilt");
    if(!e.module && !e.ghost && e.layer===LIX.S && isUntested(e.id)) cls.push("untested");
    const n=svgEl("g",{class:cls.join(" "),
      transform:`translate(${p.x} ${p.y-NODE_H/2})`,
      "data-id":id,"data-real":realOf(id),"data-slice":e.slice,
      "data-unit":unitOf(id)||"",style:`--sl:${hue}`,tabindex:"0"});
    n.appendChild(svgEl("rect",{width:NODE_W,height:NODE_H,rx:6}));
    n.appendChild(svgEl("rect",{class:"accent",width:3,height:NODE_H,rx:1.5}));
    const label = e.module ? short(e.id) : realOf(e.id);
    const i=svgEl("text",{class:"id",x:12,y:17}); i.textContent=clip(label,24);
    const s=svgEl("text",{class:"sl",x:12+Math.min(label.length,24)*7.2+8,y:17});
    s.textContent = e.slice==="unsliced" ? "" : clip(e.slice,14)+(isXC(e.slice)?" ✳":"");
    const t=svgEl("text",{class:"t",x:12,y:34});
    const note = e.ghost ? "judged below"
      : e.module ? "implements "+e.derives.join(", ")
      : e.title;
    t.textContent=clip(note,30);
    const tip=svgEl("title");
    tip.textContent = e.ghost ? realOf(e.id)+" — "+e.title
      : e.module ? e.id : e.title;
    n.append(i,s,t,tip);
    g.appendChild(n);
  }

  $("k-xing").textContent=SCENE.crossings;
  $("n-h").textContent=SCENE.hEdges.filter(e=>e.kind==="h").length;
  $("n-e").textContent=SCENE.hEdges.filter(e=>e.kind==="e").length;
  const toV=$("to-verify"), toC=$("to-corpus");
  if(toV){ toV.hidden=!SCENE.verify; toV.onclick=()=>jumpTo(VERIFY); }
  if(toC){ toC.hidden=!SCENE.verify; toC.onclick=()=>jumpTo(CORPUS); }
  $("hint").textContent="drag to pan · wheel to zoom · click an entry for its chain · "+
    (SCENE.verify?"the verification band is below the corpus · ":"")+
    "click a slice in the rail to isolate it";
  applyView();
  // Rule 2: a poll must never take the reader's pan and zoom away.
  if(!KEEP_VIEW) requestAnimationFrame(fit);
}


/* =============================================================
   ORDER VIEW

   The spine answers "what derives from what", which is vertical. It
   answers "what waits on what" badly, because depends_on is same-layer
   and lands as one arc in a gutter beside a hundred others.

   This view answers only that question, and drops everything else to do
   it. One layer at a time -- depends_on never crosses a layer, so a
   cross-layer dependency view would be drawing edges that cannot exist.

     x = how many steps of dependency deep an entry sits
     y = which slice owns it, lanes ordered by the slice's own wave

   So the left edge is what can be worked first, and a lane above another
   is a slice the one below waits on. Both orderings are computed from the
   same entry edges; neither is authored anywhere.
   ============================================================= */

/* Longest path over depends_on, cycle-guarded. Longest and not shortest
   for the same reason waves use it: an entry blocked by both a one-step
   and a four-step chain belongs after the four, or it draws an edge
   leaping backwards. The guard is there because nothing structurally
   prevents a depends_on cycle -- the gates refuse one, but this view has
   to survive drawing a graph that has not passed them yet. */
function stepDepth(ids, depsOf){
  const memo=new Map();
  const walk=(id,seen)=>{
    if(memo.has(id)) return memo.get(id);
    if(seen.has(id)) return 0;                 // cycle: stop, never hang
    seen.add(id);
    const ds=depsOf(id);
    const v=ds.length?Math.max(...ds.map(d=>walk(d,seen)+1)):0;
    seen.delete(id);
    memo.set(id,v);
    return v;
  };
  for(const id of ids) walk(id,new Set());
  return memo;
}

function buildOrderScene(layerIdx){
  const ents=STATE.entries.filter(e=>e.layer===layerIdx);
  const ids=new Set(ents.map(e=>e.id));
  const depsOf=id=>((STATE.byId[id]||{}).deps||[]).filter(d=>ids.has(d));
  const depth=stepDepth([...ids],depsOf);
  const maxStep=Math.max(0,...[...depth.values()]);

  const rank=sliceRank();
  const present=[...new Set(ents.map(e=>e.slice))]
    .sort((a,b)=>(rank[a]??99)-(rank[b]??99));

  const pos=new Map(), lanes=[];
  let cursor=0;
  for(const name of present){
    const mine=ents.filter(e=>e.slice===name);
    const cells=new Map();
    for(const e of mine){
      const d=depth.get(e.id)||0;
      (cells.get(d)||cells.set(d,[]).get(d)).push(e.id);
    }
    const tallest=Math.max(1,...[...cells.values()].map(c=>c.length));
    const h=LANE_PAD*2+tallest*NODE_H+(tallest-1)*NODE_GAP;
    for(const [d,members] of cells)
      members.forEach((id,i)=>pos.set(id,{
        x:LANE_LABEL+d*STEP_GAP,
        y:cursor+LANE_PAD+i*(NODE_H+NODE_GAP)+NODE_H/2,
        step:d, lane:name}));
    lanes.push({slice:name,top:cursor,height:h,count:mine.length,
                deps:(STATE.slices[name]||{}).deps||[],
                wave:(STATE.slices[name]||{}).wave,
                xc:isXC(name)});
    cursor+=h;
  }

  /* A dependency inside one lane is ordinary sequencing. One that crosses a
     lane is a slice waiting on another slice -- what slice dependency is
     projected FROM, and the reason a wave exists. Marked because it is a
     different fact, not a louder one. */
  const edges=[];
  const sliceOf=id=>(STATE.byId[id]||{}).slice;
  for(const e of ents){
    for(const d of e.deps) if(pos.has(d)&&pos.has(e.id))
      edges.push({kind:"h",from:d,to:e.id,cross:sliceOf(d)!==sliceOf(e.id)});
    for(const m of e.emits) if(pos.has(m)&&pos.has(e.id))
      edges.push({kind:"e",from:e.id,to:m,cross:sliceOf(m)!==sliceOf(e.id)});
  }
  return {pos,lanes,edges,maxStep,height:cursor,
          crossSlice:edges.filter(x=>x.cross&&x.kind==="h").length,
          width:LANE_LABEL+(maxStep+1)*STEP_GAP};
}

function oPath(a,b){
  const x1=a.x+NODE_W, y1=a.y, x2=b.x, y2=b.y;
  const bow=Math.max(40,(x2-x1)/2);
  return `M ${x1} ${y1} C ${x1+bow} ${y1}, ${x2-bow} ${y2}, ${x2} ${y2}`;
}

function drawOrder(){
  const S=buildOrderScene(ORDER_LAYER);
  SCENE={pos:S.pos,order:[],vEdges:[],hEdges:S.edges,crossings:0,bands:[]};
  const g=$("scene"); g.innerHTML="";

  $("empty").classList.toggle("hide", S.pos.size>0);
  if(!S.pos.size){
    $("empty").textContent="Nothing in "+LAYERS[ORDER_LAYER][1]+" yet.";
    $("k-xing").textContent="0"; $("vb-note").textContent="";
    return;
  }

  for(let s=0;s<=S.maxStep;s++){
    const t=svgEl("text",{class:"stephead",x:LANE_LABEL+s*STEP_GAP,y:-22});
    t.textContent = s===0 ? "STEP 0 · NOTHING FIRST" : "STEP "+s;
    g.appendChild(t);
  }

  S.lanes.forEach((L,i)=>{
    g.appendChild(svgEl("rect",{class:"sliceband"+(i%2?" alt":""),
      x:LANE_LABEL-16, y:L.top, width:S.width-LANE_LABEL+40, height:L.height, rx:8,
      style:`--sl:${hueOf(L.slice)}`}));
    g.appendChild(svgEl("line",{class:"lanerule",x1:LANE_LABEL-16,y1:L.top,
      x2:S.width+24,y2:L.top}));
    const nm=svgEl("text",{class:"lanelabel",x:0,y:L.top+26,style:`--sl:${hueOf(L.slice)}`});
    nm.textContent=clip(L.slice,20)+(L.xc?" ✳":"");
    const meta=svgEl("text",{class:"lanemeta",x:0,y:L.top+42});
    meta.textContent=(L.wave==null?"":"wave "+L.wave+" · ")+L.count+" entries";
    const after=svgEl("text",{class:"lanemeta",x:0,y:L.top+57});
    after.textContent=L.deps.length?"after "+clip(L.deps.join(", "),24):"waits on nothing";
    g.append(nm,meta,after);
  });

  for(const e of S.edges){
    const a=S.pos.get(e.from), b=S.pos.get(e.to);
    g.appendChild(svgEl("path",{
      class:"edge ord "+(e.kind==="e"?"e":"h")+(e.cross?" x":""),d:oPath(a,b),
      "data-from":e.from,"data-to":e.to,"data-kind":e.kind}));
  }

  for(const [id,p] of S.pos){
    const e=STATE.byId[id], hue=hueOf(e.slice);
    const n=svgEl("g",{class:"node",transform:`translate(${p.x} ${p.y-NODE_H/2})`,
      "data-id":id,"data-slice":e.slice,style:`--sl:${hue}`,tabindex:"0"});
    n.appendChild(svgEl("rect",{width:NODE_W,height:NODE_H,rx:6}));
    n.appendChild(svgEl("rect",{class:"accent",width:3,height:NODE_H,rx:1.5}));
    const i=svgEl("text",{class:"id",x:12,y:17}); i.textContent=id;
    const t=svgEl("text",{class:"t",x:12,y:34}); t.textContent=clip(e.title,30);
    const tip=svgEl("title"); tip.textContent=e.title;
    n.append(i,t,tip);
    g.appendChild(n);
  }

  // NOT the crossings KPI: that counts edges crossing each other in the
  // spine, and this is a different number entirely. Writing one into the
  // other's label is how a dashboard starts lying quietly.
  $("k-xing").textContent="—";
  $("n-h").textContent=S.edges.filter(e=>e.kind==="h").length;
  $("n-e").textContent=S.edges.filter(e=>e.kind==="e").length;
  $("vb-note").textContent=S.maxStep===0
    ? "no dependencies in this layer — everything can be worked at once"
    : (S.maxStep+1)+" steps deep · "+S.crossSlice+" of "+
      S.edges.filter(e=>e.kind==="h").length+" dependencies cross a slice";
  $("hint").textContent="left to right is dependency order · a lane above another is a "+
    "slice it waits on · click an entry for its chain";
  applyView();
  if(!KEEP_VIEW) requestAnimationFrame(fit);
}

function drawScene(){ MODE==="order" ? drawOrder() : drawSpine(); }


/* =============================================================
   READ VIEW

   The graph views answer questions about structure. Neither answers
   "what does this project actually say", which is what a person needs
   when the entries are still being written and every one of them has to
   be read at least once.

   Doing that by clicking 78 nodes is not reading, it is auditing. So
   this is the whole corpus as one continuous document, grouped by layer
   and then by slice, in the order the pipeline produced it.

   The data comes from `review?layer=X` -- one request per layer, bodies
   included, plus each entry's parents-with-titles, what it serves, and
   the comments attached to it. Four requests, not 78, and no endpoint
   had to be invented: this is the endpoint a reviewer already reads.
   ============================================================= */
const READ_CACHE = {};

async function loadLayer(letter){
  if(READ_CACHE[letter]) return READ_CACHE[letter];
  const d = await soft("projects/"+enc(STATE.project)+"/review?layer="+enc(letter),
                       {entries:[]});
  return (READ_CACHE[letter] = d.entries || []);
}

/* Layer order is the pipeline's order, not the file's: intent first,
   because a reader starting in the middle is reading conclusions before
   the premises that justify them. */
function readOrder(){
  return LAYERS.map(L=>L[0]).filter(l=>STATE.entries.some(e=>e.id[0]===l));
}

/* Within a layer, slices in the order the waves put them -- so a slice
   that waits on another is read after it, for the same reason. Unsliced
   last: it is what has not been placed yet, not a subject of its own. */
function readSlices(rows){
  const rank=sliceRank();
  const seen=[...new Set(rows.map(r=>r.slice||"unsliced"))];
  return seen.sort((a,b)=>(rank[a]??98)-(rank[b]??98));
}

const anchor = id => "rd-"+id.replace(/[^A-Za-z0-9]/g,"_");

function entryHTML(r){
  const parents=(r.derives_from_titles||[]);
  const meta=[];
  if(parents.length) meta.push("<span>serves "+parents.map(p=>
      `<b>${esc(p.id)}</b> ${esc(clip(p.title,54))}`).join("; ")+"</span>");
  if((r.depends_on||[]).length)
    meta.push("<span>waits on "+r.depends_on.map(d=>`<b>${esc(d)}</b>`).join(" ")+"</span>");
  if((r.emits_into||[]).length)
    meta.push("<span>emits into "+r.emits_into.map(d=>`<b>${esc(d)}</b>`).join(" ")+"</span>");
  if((r.served_by||[]).length)
    meta.push("<span>served by "+r.served_by.length+"</span>");
  else if(r.layer!=="spec")
    meta.push('<span class="warnish">nothing serves this yet</span>');

  const comments=(r.comments||[]).map(c=>
    `<div class="cmt"><b>comment · ${esc(c.status||"")}</b>${esc(c.title||"")}${
      c.body?"\n"+esc(c.body):""}</div>`).join("");

  return `<article id="${anchor(r.id)}" data-id="${esc(r.id)}"
      data-slice="${esc(r.slice||"unsliced")}" style="--sl:${hueOf(r.slice||"unsliced")}">
    <div class="eh"><code>${esc(r.id)}</code>
      <span class="ttl">${esc(r.title||"")}</span></div>
    ${meta.length?`<div class="meta">${meta.join("")}</div>`:""}
    <div class="bd">${esc(r.body||"")}</div>
    ${comments}
  </article>`;
}

let READ_TOKEN = 0;

async function drawRead(){
  const mine = ++READ_TOKEN;                 // a later call wins, see below
  const el=$("read"), toc=$("detail");
  el.innerHTML='<div class="doc"><p class="none">Reading…</p></div>';
  if(!STATE.project){
    el.innerHTML='<div class="doc"><p class="none">No project yet. '+
      'The document appears once a project holds entries.</p></div>';
    // Blank is worse than empty: a column with nothing in it reads as
    // something that failed to load rather than something with nothing to say.
    toc.innerHTML='<h3>Contents</h3><p class="muted">Nothing to read yet.</p>';
    $("vb-note").textContent="";
    return; }

  const letters = RD_LAYER==="*" ? readOrder() : [RD_LAYER];
  const loaded = await Promise.all(letters.map(loadLayer));
  // Switching layer twice quickly leaves two loads in flight; the slower
  // one must not overwrite the faster one's document.
  if(mine!==READ_TOKEN) return;

  const find=(RD_FIND||"").trim().toLowerCase();
  let doc="", nav="", shown=0, total=0;

  letters.forEach((letter,i)=>{
    let rows=loaded[i]||[];
    total+=rows.length;
    if(focusSlice) rows=rows.filter(r=>(r.slice||"unsliced")===focusSlice);
    if(find) rows=rows.filter(r=>
      ((r.title||"")+" "+(r.body||"")+" "+r.id).toLowerCase().includes(find));
    if(!rows.length) return;
    shown+=rows.length;

    const name=LAYERS[LIX[letter]][1];
    doc+=`<h1 class="layerhead" id="rd-layer-${letter}">${esc(name)}<b>${
      rows.length} ${rows.length===1?"entry":"entries"}</b></h1>`;
    nav+=`<div class="lay">${esc(name)}</div>`;

    for(const slice of readSlices(rows)){
      const mineRows=rows.filter(r=>(r.slice||"unsliced")===slice);
      if(!mineRows.length) continue;
      const info=STATE.slices[slice]||{};
      doc+=`<h2 style="--sl:${hueOf(slice)}">${esc(slice)}
        <span class="tag">${info.wave==null?"":"wave "+info.wave+" · "}${
          mineRows.length}${isXC(slice)?" · cross-cutting":""}</span></h2>
        <div class="sliceline" style="--sl:${hueOf(slice)}"></div>`;
      nav+=`<div class="sl" style="--sl:${hueOf(slice)}" data-jump="rd-layer-${letter}">
        <i></i>${esc(slice)}</div>`;
      for(const r of mineRows){
        doc+=entryHTML(r);
        nav+=`<a href="#${anchor(r.id)}" data-a="${anchor(r.id)}"><code>${
          esc(r.id)}</code>${esc(clip(r.title||"",40))}</a>`;
      }
    }
  });

  if(!doc) doc=`<p class="none">Nothing matches${find?" “"+esc(find)+"”":""}${
    focusSlice?" in "+esc(focusSlice):""}.</p>`;
  el.innerHTML='<div class="doc">'+doc+'</div>';
  toc.innerHTML='<h3>Contents</h3><div id="toc">'+(nav||'<p class="muted">Nothing to show.</p>')+'</div>';

  $("vb-note").textContent = find||focusSlice
    ? shown+" of "+total+" entries shown"
    : total+" entries · "+letters.length+(letters.length===1?" layer":" layers");

  for(const a of toc.querySelectorAll("#toc a")) a.onclick=ev=>{
    ev.preventDefault();
    const t=document.getElementById(a.dataset.a);
    // Smooth here: the reader asked to go somewhere, and the motion says
    // where they went.
    if(t){ t.scrollIntoView({block:"start",behavior:"smooth"}); flashEntry(t); }
  };
  for(const s of toc.querySelectorAll("#toc .sl")) s.onclick=()=>{
    const t=document.getElementById(s.dataset.jump);
    if(t) t.scrollIntoView({block:"start",behavior:"smooth"});
  };
  markRead();
}

function flashEntry(node){
  for(const a of $("read").querySelectorAll("article.hit")) a.classList.remove("hit");
  node.classList.add("hit");
}

/* Which entry the reader is actually on, so the outline tracks the
   document rather than only driving it. Cheap scan over article tops --
   at these sizes it is instant, and it avoids an observer whose
   thresholds would need tuning per viewport. */
function markRead(){
  const el=$("read"), arts=[...el.querySelectorAll("article")];
  if(!arts.length) return;
  const top=el.scrollTop+90;
  let cur=arts[0];
  for(const a of arts){ if(a.offsetTop<=top) cur=a; else break; }
  for(const a of $("detail").querySelectorAll("#toc a"))
    a.classList.toggle("here", a.dataset.a===anchor(cur.dataset.id));
}

function applyView(){
  $("scene").setAttribute("transform",`translate(${view.x} ${view.y}) scale(${view.k})`);
  $("svg").classList.toggle("far",view.k<0.72);   // level of detail
}
function fitTo(box){
  const c=$("canvas").getBoundingClientRect();
  if(!box.width||!box.height) return;
  // Never open below the legibility floor. A real project is wider than
  // the pane, and a whole graph scaled until nothing can be read is a
  // worse first screen than a readable corner you can pan out of.
  const k=Math.max(0.55,Math.min(1.3,
    Math.min((c.width-90)/box.width,(c.height-110)/box.height)));
  view.k=k;
  view.x=(c.width-box.width*k)/2-box.x*k;
  const drawn=box.height*k;
  view.y = drawn>c.height-140 ? (c.height-drawn)/2-box.y*k : 64-box.y*k;
  applyView();
}
const fit=()=>{ try{ fitTo($("scene").getBBox()); }catch(_){} };

/* The bands are deliberately far apart -- far enough that fit() hits its
   legibility floor before both are on screen, which is correct and is also
   why these exist. Computed from the scene rather than from a stored
   scroll position, so they stay right when the graph changes under them. */
function jumpTo(band){
  if(!SCENE) return;
  const x0=COL_X(band===VERIFY?LIX.S:0)-40;
  const x1=(band===VERIFY?COL_X(MODULE_LAYER)+NODE_W:SCENE.width)+40;
  const y0=band===VERIFY?SCENE.bandTop-90:-40;
  const y1=band===VERIFY?SCENE.height+20:(SCENE.bandTop?SCENE.bandTop-BAND_GAP:SCENE.height)+20;
  fitTo({x:x0,y:y0,width:x1-x0,height:y1-y0});
}

/* A real graph is wider than the pane, so an entry reached from the
   issue queue is routinely off-screen. Selecting it without moving
   there makes the click look inert -- the inspector fills in somewhere
   the reader is not looking. Pan only when it is actually outside;
   recentring on something already visible is its own kind of wrong. */
function reveal(id){
  if(!SCENE || !SCENE.pos.has(id)) return;
  const p=SCENE.pos.get(id), c=$("canvas").getBoundingClientRect();
  const sx=view.x+p.x*view.k, sy=view.y+p.y*view.k;
  const pad=80;
  if(sx>pad && sx<c.width-NODE_W*view.k-pad && sy>pad && sy<c.height-pad) return;
  view.x=c.width/2-(p.x+NODE_W/2)*view.k;
  view.y=c.height/2-p.y*view.k;
  applyView();
}

/* Everything a selection lights, in one place, so nothing computes
   a different set than the thing next to it. */
function litSet(){
  if(!sel) return null;
  const side=sideOf(sel);
  const ids=[sel,...upFrom(sel),...downTo(sel),...side.need,...side.served];
  /* A ghost stands in for its entry, so it lights when the entry does.
     Otherwise selecting a spec entry dims the copy of itself sitting
     directly under the scenarios that judge it. */
  return new Set([...ids, ...ids.map(GHOST)]);
}

/* The work unit a selection belongs to, as a set of node ids. THIS is
   work units on the spine, and it is deliberately not a hull and not a
   column: a unit groups entries and files across columns and across both
   bands, so any permanent shape drawn around one states an adjacency the
   graph does not have. Shown on demand instead -- select anything, and
   the branch it would be built on lights up with it. */
function unitSet(){
  const key = sel && unitOf(sel);
  if(!key) return null;
  const out=new Set();
  for(const id of Object.keys(UNITX)) if(UNITX[id]===key){ out.add(id); out.add(GHOST(id)); }
  return out;
}

/* THE only writer of visual state. Every control calls this and
   nothing else touches a class -- which is what makes "clear it" a
   real operation rather than a second code path that has to
   remember to undo whatever the first one did. */
function repaint(){
  const g=$("scene"), lit=litSet(), unit=unitSet();
  for(const n of g.querySelectorAll(".node")){
    const inSlice = !focusSlice || n.dataset.slice===focusSlice;
    n.classList.toggle("sel", n.dataset.real===sel);
    n.classList.toggle("peer", !!(unit && unit.has(n.dataset.id) && n.dataset.real!==sel));
    n.classList.toggle("dim", !inSlice || !!(lit && !lit.has(n.dataset.id)));
  }
  for(const p of g.querySelectorAll(".edge")){
    const k=p.dataset.kind;
    // A kind switched off is HIDDEN, not dimmed. Dimming a dashed
    // 1.4px arc to 12% is indistinguishable from it still being on.
    const shown = (k==="v") || (k==="h"&&$("t-h").checked) || (k==="e"&&$("t-e").checked);
    p.classList.toggle("off", !shown);
    const ends=[p.dataset.from,p.dataset.to];
    const inSlice = !focusSlice ||
      ends.every(i=>(STATE.byId[realOf(i)]||{}).slice===focusSlice);
    const on = inSlice && !!lit && ends.every(i=>lit.has(i));
    p.classList.toggle("lit", on);
    p.classList.toggle("dim", !inSlice || !!(lit && !on));
  }
}

/* Selection and slice focus are two answers to the same question --
   "what am I looking at" -- so setting either clears the other. Left
   as independent filters they intersect, and an entry selected
   outside the focused slice dims the whole graph with no way back. */
function pick(id){
  id = realOf(id);                 // clicking a copy selects what it copies
  const e=STATE.byId[id]; if(!e) return;
  focusSlice=null; syncLegend();
  sel=id; repaint(); reveal(id);
  const down=downTo(id), side=sideOf(id);
  const pills=(label,ids)=>ids.length
    ? `<div class="edgelist"><span>${esc(label)}</span>${ids.map(i=>
        `<button class="pill" data-goto="${esc(i)}">${esc(STATE.byId[i]?
          (STATE.byId[i].module?short(i):i):i)}</button>`).join("")}</div>` : "";
  $("detail").innerHTML=
    `<h3>${e.module?"Module":"Entry"}</h3>
     <p><code>${esc(e.module?e.id:e.id)}</code>${e.module?"":" · <b>"+esc(e.title)+"</b>"}</p>
     <p class="muted">slice <b style="color:${hueOf(e.slice)}">${esc(e.slice)}</b>${
        isXC(e.slice)?" · cross-cutting":""} · layer ${esc(LAYERS[e.layer][1])}</p>
     <div class="body" id="body">${e.module?"Code is not an entry in this graph. This is the "+
        "declared backlink — the only thing tying the file to the reasoning that produced it.":
        "loading…"}</div>
     <h3>Edges</h3>
     ${pills(e.module?"implements":"derives from — one layer up", e.derives)}
     ${pills("depends on — same layer, imposes order", e.deps)}
     ${pills("emits into — cross-cutting, no order", e.emits)}
     ${pills("derived below", kids(e.id).filter(k=>!k.test).map(k=>k.id))}
     ${verifyPanel(e)}
     ${unitPanel(e)}
     <h3>Radius</h3>
     <p class="muted"><b style="color:var(--ink);font-size:15px">${down.size}</b> entries downstream ·
